<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>注文受付</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f3f4f6;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    Meiryo,
    sans-serif;
}

.container {
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 24px;
  text-align: center;
  font-size: 30px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.section-title {
  font-size: 21px;
  font-weight: bold;
  margin: 0 0 16px;
}

label.main-label {
  display: block;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 8px;
}

input[type="text"],
input[type="date"],
textarea,
select {
  width: 100%;
  font-size: 18px;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 10px;
  background: #fff;
  outline: none;
}

input[type="text"]:focus,
input[type="date"]:focus,
textarea:focus,
select:focus {
  border-color: #555;
}

textarea {
  min-height: 130px;
  resize: vertical;
  line-height: 1.6;
}

.form-group {
  margin-bottom: 28px;
}

.form-group:last-child {
  margin-bottom: 0;
}


/* =========================================================
   商品選択
========================================================= */

.product-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.product-option {
  position: relative;
}

.product-option input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.product-option label {
  display: flex;
  align-items: center;
  min-height: 64px;
  padding: 12px 14px;
  border: 3px solid transparent;
  border-radius: 13px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.15s;
}


/* ① 名刺 → 赤 */

.product-option:nth-child(1) label {
  background: #ffd6d6;
  border-color: #ff8c8c;
}

.product-option:nth-child(1) input:checked + label {
  background: #ff9999;
  border-color: #d60000;
  box-shadow: 0 0 0 3px rgba(214,0,0,0.18);
}


/* ② 印鑑 → 青 */

.product-option:nth-child(2) label {
  background: #d6e7ff;
  border-color: #8ab8ff;
}

.product-option:nth-child(2) input:checked + label {
  background: #91bcff;
  border-color: #1455b8;
  box-shadow: 0 0 0 3px rgba(20,85,184,0.18);
}


/* ③ スタンプ・ゴム印 → 水色 */

.product-option:nth-child(3) label {
  background: #d5f5ff;
  border-color: #83dff2;
}

.product-option:nth-child(3) input:checked + label {
  background: #8ee7f7;
  border-color: #008ca8;
  box-shadow: 0 0 0 3px rgba(0,140,168,0.18);
}


/* ④ 封筒 → 黄緑 */

.product-option:nth-child(4) label {
  background: #e7f6c9;
  border-color: #b7d96c;
}

.product-option:nth-child(4) input:checked + label {
  background: #c8e985;
  border-color: #6c9700;
  box-shadow: 0 0 0 3px rgba(108,151,0,0.18);
}


/* ⑤ チラシ・パンフレット → 緑 */

.product-option:nth-child(5) label {
  background: #d5f0d8;
  border-color: #82c98b;
}

.product-option:nth-child(5) input:checked + label {
  background: #8bd398;
  border-color: #278238;
  box-shadow: 0 0 0 3px rgba(39,130,56,0.18);
}


/* ⑥ ホームページ → 灰色 */

.product-option:nth-child(6) label {
  background: #e4e4e4;
  border-color: #b8b8b8;
}

.product-option:nth-child(6) input:checked + label {
  background: #bcbcbc;
  border-color: #666;
  box-shadow: 0 0 0 3px rgba(80,80,80,0.18);
}


/* ⑦ 入稿データ → オレンジ */

.product-option:nth-child(7) label {
  background: #ffe1bd;
  border-color: #f4ad63;
}

.product-option:nth-child(7) input:checked + label {
  background: #ffc078;
  border-color: #d66b00;
  box-shadow: 0 0 0 3px rgba(214,107,0,0.18);
}


/* ⑧ 伝票 → 狐色 */

.product-option:nth-child(8) label {
  background: #ead2ad;
  border-color: #c99b54;
}

.product-option:nth-child(8) input:checked + label {
  background: #d8ad68;
  border-color: #8b5a18;
  box-shadow: 0 0 0 3px rgba(139,90,24,0.18);
}


/* ⑨ オーダーメイド依頼 → 紫 */

.product-option:nth-child(9) label {
  background: #eadcff;
  border-color: #b89ae8;
}

.product-option:nth-child(9) input:checked + label {
  background: #c7a9f3;
  border-color: #7138ad;
  box-shadow: 0 0 0 3px rgba(113,56,173,0.18);
}


/* ⑩ オーダーメイド決定 → ピンク */

.product-option:nth-child(10) label {
  background: #ffd9e7;
  border-color: #f09ab8;
}

.product-option:nth-child(10) input:checked + label {
  background: #f6a9c3;
  border-color: #c72d67;
  box-shadow: 0 0 0 3px rgba(199,45,103,0.18);
}


/* ⑪ 持込印材 → 白 */

.product-option:nth-child(11) label {
  background: #ffffff;
  border-color: #bdbdbd;
}

.product-option:nth-child(11) input:checked + label {
  background: #f2f2f2;
  border-color: #555;
  box-shadow: 0 0 0 3px rgba(80,80,80,0.18);
}

.product-option label:active {
  transform: scale(0.98);
}


/* =========================================================
   受付日
========================================================= */

.date-area {
  margin-bottom: 30px;
}

.date-area input {
  display: block;
}


/* =========================================================
   備考
========================================================= */

.notes-area {
  margin-top: 4px;
  padding-top: 4px;
}

.notes-area textarea {
  display: block;
}


/* =========================================================
   写真
========================================================= */

.photo-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.photo-button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 58px;
  padding: 12px;
  border-radius: 12px;
  border: 2px solid #333;
  background: #fff;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.photo-button:active {
  background: #eee;
}

.photo-info {
  margin-top: 10px;
  font-size: 14px;
  color: #666;
}

.photo-preview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.photo-item {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 10px;
  overflow: hidden;
  background: #eee;
}

.photo-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-delete {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.75);
  color: #fff;
  font-size: 17px;
  cursor: pointer;
}


/* =========================================================
   注意事項
========================================================= */

.notice-area {
  display: none;
  margin-top: 24px;
  padding: 18px;
  border: 2px solid #ddd;
  border-radius: 12px;
  background: #fafafa;
}

.notice-area.show {
  display: block;
}

.notice-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 14px;
}

.notice-item {
  margin-bottom: 12px;
}

.notice-item:last-child {
  margin-bottom: 0;
}

.notice-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px;
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
  line-height: 1.6;
  font-size: 15px;
}

.notice-label input {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  margin-top: 2px;
}

.notice-warning {
  margin: 5px 0 0 35px;
  color: #d00000;
  font-weight: bold;
  font-size: 14px;
  line-height: 1.5;
}


/* =========================================================
   署名
========================================================= */

.signature-box {
  border: 2px solid #ccc;
  border-radius: 12px;
  background: #fff;
  overflow: hidden;
}

#signatureCanvas {
  display: block;
  width: 100%;
  height: 220px;
  touch-action: none;
  background: #fff;
}

.signature-buttons {
  display: flex;
  justify-content: flex-end;
  padding: 10px;
  border-top: 1px solid #ddd;
}

.clear-signature {
  border: 1px solid #aaa;
  background: #fff;
  padding: 9px 15px;
  border-radius: 8px;
  font-size: 14px;
}


/* =========================================================
   保存ボタン
========================================================= */

.save-button {
  width: 100%;
  min-height: 65px;
  border: none;
  border-radius: 14px;
  background: #222;
  color: #fff;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
}

.save-button:active {
  transform: scale(0.99);
  background: #000;
}


/* =========================================================
   保存済み注文
========================================================= */

.order-card {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
  background: #fff;
}

.order-number {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.order-info {
  line-height: 1.8;
  font-size: 16px;
}

.order-photos {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.order-photos img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 8px;
}

.order-signature {
  margin-top: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fff;
  width: 100%;
}

.delete-button {
  margin-top: 15px;
  width: 100%;
  padding: 12px;
  border: 1px solid #d00000;
  border-radius: 9px;
  background: #fff;
  color: #d00000;
  font-size: 16px;
  font-weight: bold;
}


/* =========================================================
   メッセージ
========================================================= */

.message {
  display: none;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 10px;
  font-weight: bold;
  text-align: center;
}

.message.show {
  display: block;
}

.message.success {
  background: #e7f6e7;
  color: #207020;
}

.message.error {
  background: #ffe8e8;
  color: #b00000;
}


/* =========================================================
   スマホ・iPad縦
========================================================= */

@media (max-width: 600px) {

  body {
    padding: 12px;
  }

  .card {
    padding: 18px;
  }

  h1 {
    font-size: 25px;
  }

  .product-grid {
    grid-template-columns: 1fr;
  }

  .photo-buttons {
    grid-template-columns: 1fr;
  }

  #signatureCanvas {
    height: 200px;
  }

}


/* =========================================================
   iPad横向き
========================================================= */

@media (min-width: 700px) and (orientation: landscape) {

  body {
    padding: 25px;
  }

  .container {
    max-width: 900px;
  }

  .product-grid {
    grid-template-columns: repeat(3, 1fr);
  }

}
</style>
</head>


<body>

<div class="container">

  <h1>注文受付</h1>

  <div id="message" class="message"></div>


  <!-- =====================================================
       基本情報
  ====================================================== -->

  <div class="card">

    <div class="section-title">
      基本情報
    </div>


    <!-- お客様名 -->

    <div class="form-group">

      <label class="main-label" for="customerName">
        お客様名または会社名
      </label>

      <input
        type="text"
        id="customerName"
        placeholder="お名前・会社名を入力"
      >

    </div>


    <!-- 商品 -->

    <div class="form-group">

      <label class="main-label">
        商品
      </label>

      <div class="product-grid">


        <div class="product-option">

          <input
            type="radio"
            name="product"
            id="product1"
            value="① 名刺"
          >

          <label for="product1">
            ① 名刺
          </label>

        </div>


        <div class="product-option">

          <input
            type="radio"
            name="product"
            id="product2"
            value="② 印鑑"
          >

          <label for="product2">
            ② 印鑑
          </label>

        </div>


        <div class="product-option">

          <input
            type="radio"
            name="product"
            id="product3"
            value="③ スタンプ・ゴム印"
          >

          <label for="product3">
            ③ スタンプ・ゴム印
          </label>

        </div>


        <div class="product-option">

          <input
            type="radio"
            name="product"
            id="product4"
            value="④ 封筒"
          >

          <label for="product4">
            ④ 封筒
          </label>

        </div>


        <div class="product-option">

          <input
            type="radio"
            name="product"
            id="product5"
            value="⑤ チラシ・パンフレット"
          >

          <label for="product5">
            ⑤ チラシ・パンフレット
          </label>

        </div>


        <div class="product-option">

          <input
            type="radio"
            name="product"
            id="product6"
            value="⑥ ホームページ"
          >

          <label for="product6">
            ⑥ ホームページ
          </label>

        </div>


        <div class="product-option">

          <input
            type="radio"
            name="product"
            id="product7"
            value="⑦ 入稿データ"
          >

          <label for="product7">
            ⑦ 入稿データ
          </label>

        </div>


        <div class="product-option">

          <input
            type="radio"
            name="product"
            id="product8"
            value="⑧ 伝票"
          >

          <label for="product8">
            ⑧ 伝票
          </label>

        </div>


        <div class="product-option">

          <input
            type="radio"
            name="product"
            id="product9"
            value="⑨ オーダーメイド依頼"
          >

          <label for="product9">
            ⑨ オーダーメイド依頼
          </label>

        </div>


        <div class="product-option">

          <input
            type="radio"
            name="product"
            id="product10"
            value="⑩ オーダーメイド決定"
          >

          <label for="product10">
            ⑩ オーダーメイド決定
          </label>

        </div>


        <div class="product-option">

          <input
            type="radio"
            name="product"
            id="product11"
            value="⑪ 持込印材"
          >

          <label for="product11">
            ⑪ 持込印材
          </label>

        </div>

      </div>

    </div>


    <!-- 受付日 -->

    <div class="form-group date-area">

      <label
        class="main-label"
        for="delivery"
      >
        受付日
      </label>

      <input
        type="date"
        id="delivery"
      >

    </div>


    <!-- 備考 -->

    <div class="form-group notes-area">

      <label
        class="main-label"
        for="notes"
      >
        備考
      </label>

      <textarea
        id="notes"
        placeholder="その他の内容や申し送り事項など"
      ></textarea>

    </div>

  </div>


  <!-- =====================================================
       写真
  ====================================================== -->

  <div class="card">

    <div class="section-title">
      お客様から預かった資料・現物写真
    </div>


    <div class="photo-buttons">

      <label class="photo-button">

        📷 カメラで撮影

        <input
          type="file"
          id="cameraInput"
          accept="image/*"
          capture="environment"
          hidden
        >

      </label>


      <label class="photo-button">

        🖼 写真から選ぶ

        <input
          type="file"
          id="photoInput"
          accept="image/*"
          multiple
          hidden
        >

      </label>

    </div>


    <div class="photo-info">
      ※写真は最大3枚まで登録できます。
    </div>


    <div
      id="photoPreview"
      class="photo-preview"
    ></div>

  </div>


  <!-- =====================================================
       注意事項
  ====================================================== -->

  <div
    id="noticeArea"
    class="card notice-area"
  >

    <div class="notice-title">
      注意事項・確認事項
    </div>

    <div id="noticeList"></div>

  </div>


  <!-- =====================================================
       署名
  ====================================================== -->

  <div class="card">

    <div class="section-title">
      お客様署名
    </div>


    <div class="signature-box">

      <canvas
        id="signatureCanvas"
      ></canvas>


      <div class="signature-buttons">

        <button
          type="button"
          class="clear-signature"
          id="clearSignature"
        >
          署名を消す
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       保存
  ====================================================== -->

  <div class="card">

    <button
      type="button"
      class="save-button"
      id="saveButton"
    >
      注文を保存する
    </button>

  </div>


  <!-- =====================================================
       保存済み注文
  ====================================================== -->

  <div class="card">

    <div class="section-title">
      保存済み注文
    </div>

    <div id="orderList"></div>

  </div>

</div>

function handleFiles(
  fileList
) {

  const files =
    Array.from(
      fileList
    );


  if (
    photos.length >= 3
  ) {

    showMessage(
      "写真は最大3枚までです。",
      "error"
    );

    return;

  }


  for (
    const file of files
  ) {

    if (
      photos.length >= 3
    ) {

      break;

    }


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      continue;

    }


    compressImage(
      file,
      function(dataUrl) {

        photos.push(
          dataUrl
        );

        renderPhotos();

      }
    );

  }

}


/* =========================================================
   写真圧縮
========================================================= */

function compressImage(
  file,
  callback
) {

  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      const img =
        new Image();


      img.onload =
        function() {

          const maxSize =
            1200;


          let width =
            img.width;

          let height =
            img.height;


          if (
            width > height
          ) {

            if (
              width > maxSize
            ) {

              height =
                Math.round(
                  height *
                  maxSize /
                  width
                );

              width =
                maxSize;

            }

          } else {

            if (
              height > maxSize
            ) {

              width =
                Math.round(
                  width *
                  maxSize /
                  height
                );

              height =
                maxSize;

            }

          }


          const tempCanvas =
            document.createElement(
              "canvas"
            );


          tempCanvas.width =
            width;

          tempCanvas.height =
            height;


          const tempCtx =
            tempCanvas.getContext(
              "2d"
            );


          tempCtx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          const dataUrl =
            tempCanvas.toDataURL(
              "image/jpeg",
              0.75
            );


          callback(
            dataUrl
          );

        };


      img.src =
        e.target.result;

    };


  reader.readAsDataURL(
    file
  );

}

/* =========================================================
   署名キャンバス
========================================================= */

function resizeCanvas() {

  const ratio =
    Math.max(
      window.devicePixelRatio ||
      1,
      1
    );


  const rect =
    canvas.getBoundingClientRect();


  canvas.width =
    rect.width * ratio;

  canvas.height =
    rect.height * ratio;


  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );


  ctx.lineWidth =
    2.5;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  ctx.strokeStyle =
    "#111";

}


resizeCanvas();


window.addEventListener(
  "resize",
  function() {

    resizeCanvas();

  }
);


/* 署名位置 */

function getPosition(e) {

  const rect =
    canvas.getBoundingClientRect();


  return {

    x:
      e.clientX -
      rect.left,

    y:
      e.clientY -
      rect.top

  };

}


/* 署名開始 */

canvas.addEventListener(
  "pointerdown",
  function(e) {

    drawing =
      true;


    canvas.setPointerCapture(
      e.pointerId
    );


    const pos =
      getPosition(e);


    ctx.beginPath();


    ctx.moveTo(
      pos.x,
      pos.y
    );

  }
);


/* 署名中 */

canvas.addEventListener(
  "pointermove",
  function(e) {

    if (
      !drawing
    ) {

      return;

    }


    const pos =
      getPosition(e);


    ctx.lineTo(
      pos.x,
      pos.y
    );


    ctx.stroke();

  }
);


/* 署名終了 */

canvas.addEventListener(
  "pointerup",
  function() {

    drawing =
      false;

  }
);


canvas.addEventListener(
  "pointercancel",
  function() {

    drawing =
      false;

  }
);


/* 署名を消す */

clearSignature.addEventListener(
  "click",
  function() {

    clearCanvas();

  }
);


function clearCanvas() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  resizeCanvas();

}


/* =========================================================
   署名確認
========================================================= */

function hasSignature() {

  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  for (
    let i = 3;
    i <
    imageData.data.length;
    i += 4
  ) {

    if (
      imageData.data[i] !== 0
    ) {

      return true;

    }

  }


  return false;

}


/* =========================================================
   注文番号
========================================================= */

function createOrderNumber() {

  const orders =
    JSON.parse(
      localStorage.getItem(
        "orders"
      ) || "[]"
    );


  const now =
    new Date();


  const todayText =
    String(
      now.getFullYear()
    ) +

    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +

    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  const todayOrders =
    orders.filter(
      order =>
        order.orderNumber &&
        order.orderNumber.startsWith(
          todayText
        )
    );


  const number =
    String(
      todayOrders.length + 1
    ).padStart(
      3,
      "0"
    );


  return (
    todayText +
    "-" +
    number
  );

}

saveButton.addEventListener(
  "click",
  function() {


    /* お客様名 */

    const name =
      customerName.value.trim();


    /* 商品 */

    const productElement =
      document.querySelector(
        'input[name="product"]:checked'
      );


    /* 受付日 */

    const receptionDate =
      delivery.value;


    /* 備考 */

    const note =
      notes.value.trim();


    /* -----------------------------------------------------
       お客様名チェック
    ----------------------------------------------------- */

    if (
      !name
    ) {

      showMessage(
        "お客様名または会社名を入力してください。",
        "error"
      );


      customerName.focus();


      return;

    }


    /* -----------------------------------------------------
       商品チェック
    ----------------------------------------------------- */

    if (
      !productElement
    ) {

      showMessage(
        "商品を選択してください。",
        "error"
      );


      return;

    }


    /* -----------------------------------------------------
       受付日チェック
    ----------------------------------------------------- */

    if (
      !receptionDate
    ) {

      showMessage(
        "受付日を入力してください。",
        "error"
      );


      return;

    }


    const product =
      productElement.value;


    const productName =
      product.replace(
        /^[①-⑪] /,
        ""
      );


    /* -----------------------------------------------------
       注意事項チェック
    ----------------------------------------------------- */

    const notices =
      noticeData[
        productName
      ] || [];


    if (
      notices.length > 0
    ) {

      const checkboxes =
        noticeList.querySelectorAll(
          'input[type="checkbox"]'
        );


      const allChecked =
        Array.from(
          checkboxes
        ).every(
          checkbox =>
            checkbox.checked
        );


      if (
        !allChecked
      ) {

        showMessage(
          "注意事項をすべて確認してチェックしてください。",
          "error"
        );


        noticeArea.scrollIntoView({
          behavior:
            "smooth",

          block:
            "center"
        });


        return;

      }

    }


    /* -----------------------------------------------------
       署名チェック
    ----------------------------------------------------- */

    if (
      !hasSignature()
    ) {

      showMessage(
        "お客様の署名をお願いします。",
        "error"
      );


      document
        .querySelector(
          ".signature-box"
        )
        .scrollIntoView({
          behavior:
            "smooth",

          block:
            "center"
        });


      return;

    }


    /* -----------------------------------------------------
       注文番号
    ----------------------------------------------------- */

    const orderNumber =
      createOrderNumber();


    /* -----------------------------------------------------
       署名
    ----------------------------------------------------- */

    const signature =
      canvas.toDataURL(
        "image/png"
      );


    /* -----------------------------------------------------
       注文データ
    ----------------------------------------------------- */

    const order = {

      orderNumber:
        orderNumber,

      customerName:
        name,

      product:
        product,

      receptionDate:
        receptionDate,

      notes:
        note,

      photos:
        photos,

      signature:
        signature,

      noticesAgreed:
        notices.length > 0,

      createdAt:
        new Date().toISOString()

    };


    /* -----------------------------------------------------
       保存
    ----------------------------------------------------- */

    const orders =
      JSON.parse(
        localStorage.getItem(
          "orders"
        ) || "[]"
      );


    orders.push(
      order
    );


    try {

      localStorage.setItem(
        "orders",
        JSON.stringify(
          orders
        )
      );

    } catch (
      error
    ) {

      showMessage(
        "保存できませんでした。写真の容量が大きい可能性があります。",
        "error"
      );


      return;

    }


    /* 保存完了 */

    showMessage(
      `注文番号 ${orderNumber} を保存しました。`,
      "success"
    );


    resetForm();


    renderOrders();

  }
);

/* =========================================================
   保存済み注文表示
========================================================= */

function renderOrders() {

  const orders =
    JSON.parse(
      localStorage.getItem(
        "orders"
      ) || "[]"
    );


  orderList.innerHTML =
    "";


  if (
    orders.length === 0
  ) {

    orderList.innerHTML =
      '<div style="color:#777;">保存された注文はありません。</div>';


    return;

  }


  const sortedOrders =
    [
      ...orders
    ].reverse();


  sortedOrders.forEach(
    (
      order,
      reverseIndex
    ) => {


      const actualIndex =
        orders.length -
        1 -
        reverseIndex;


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "order-card";


      /* 注文番号 */

      const number =
        document.createElement(
          "div"
        );


      number.className =
        "order-number";


      number.textContent =
        "注文番号：" +
        order.orderNumber;


      /* 注文情報 */

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "order-info";


      info.innerHTML = `

        <strong>お客様：</strong>
        ${escapeHtml(
          order.customerName
        )}

        <br>

        <strong>商品：</strong>
        ${escapeHtml(
          order.product
        )}

        <br>

        <strong>受付日：</strong>
        ${escapeHtml(
          order.receptionDate
        )}

        <br>

        <strong>備考：</strong>
        ${
          order.notes

            ? escapeHtml(
                order.notes
              ).replace(
                /\n/g,
                "<br>"
              )

            : "なし"
        }

      `;


      card.appendChild(
        number
      );


      card.appendChild(
        info
      );


      /* 写真 */

      if (
        order.photos &&
        order.photos.length > 0
      ) {

        const photosDiv =
          document.createElement(
            "div"
          );


        photosDiv.className =
          "order-photos";


        order.photos.forEach(
          photo => {

            const img =
              document.createElement(
                "img"
              );


            img.src =
              photo;


            photosDiv.appendChild(
              img
            );

          }
        );


        card.appendChild(
          photosDiv
        );

      }


      /* 署名 */

      if (
        order.signature
      ) {

        const signatureImg =
          document.createElement(
            "img"
          );


        signatureImg.className =
          "order-signature";


        signatureImg.src =
          order.signature;


        card.appendChild(
          signatureImg
        );

      }


      /* 削除 */

      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-button";


      deleteButton.type =
        "button";


      deleteButton.textContent =
        "この注文を削除";


      deleteButton.addEventListener(
        "click",
        function() {


          const ok =
            confirm(
              `注文番号 ${order.orderNumber} を削除しますか？`
            );


          if (
            !ok
          ) {

            return;

          }


          orders.splice(
            actualIndex,
            1
          );


          localStorage.setItem(
            "orders",
            JSON.stringify(
              orders
            )
          );


          renderOrders();

        }
      );


      card.appendChild(
        deleteButton
      );


      orderList.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text ?? "";


  return div.innerHTML;

}
