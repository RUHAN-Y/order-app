<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>署名受付アプリ</title>

<style>

body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
    color: #222;
}

.container {
    max-width: 600px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
textarea,
select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

textarea {
    height: 90px;
    resize: vertical;
}


/* =========================
   その他の商品
========================= */

#otherProductArea {
    display: none;
}


/* =========================
   資料写真
========================= */

.photo-info {
    font-size: 13px;
    color: #777;
    margin-bottom: 8px;
}

.photo-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
}

.photo-item {
    width: calc(33.333% - 7px);
    position: relative;
}

.photo-item img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.photo-remove {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 30px;
    height: 30px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    background: #e53935;
    color: white;
    font-size: 18px;
    line-height: 30px;
}


/* =========================
   署名
========================= */

#signature {
    width: 100%;
    height: 200px;
    border: 2px solid #333;
    border-radius: 8px;
    background: white;
    touch-action: none;
    display: block;
}


/* =========================
   ボタン
========================= */

button {
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    margin-top: 12px;
    cursor: pointer;
}

.save-button {
    background: #111;
    color: white;
}

.clear-button {
    background: #ddd;
    color: #222;
}

.delete-button {
    background: #e53935;
    color: white;
}


/* =========================
   保存済み注文
========================= */

.order {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
    background: #fafafa;
    line-height: 1.8;
}

.order-number {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 10px;
}


/* =========================
   保存済み写真
========================= */

.saved-photos {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
}

.saved-photos img {
    width: calc(33.333% - 6px);
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #ccc;
}


/* =========================
   保存済み署名
========================= */

.signature-image {
    width: 100%;
    max-height: 150px;
    object-fit: contain;
    border: 1px solid #ddd;
    background: white;
    margin-top: 10px;
}

</style>

</head>


<body>


<div class="container">


<h1>注文受付</h1>


<div class="card">


<!-- =========================
     お客様名
========================= -->

<label>お客様名</label>

<input
    type="text"
    id="name"
    placeholder="例：山田 太郎"
>


<!-- =========================
     商品
========================= -->

<label>商品</label>

<select
    id="product"
    onchange="checkOtherProduct()"
>

    <option value="">
        選択してください
    </option>

    <option value="名刺">
        ① 名刺
    </option>

    <option value="印鑑">
        ② 印鑑
    </option>

    <option value="スタンプ・ゴム印">
        ③ スタンプ・ゴム印
    </option>

    <option value="封筒">
        ④ 封筒
    </option>

    <option value="チラシ・パンフレット">
        ⑤ チラシ・パンフレット
    </option>

    <option value="ホームページ">
        ⑥ ホームページ
    </option>

    <option value="その他">
        ⑦ その他
    </option>

</select>


<!-- その他の商品名 -->

<div id="otherProductArea">

    <label>その他の商品名</label>

    <input
        type="text"
        id="otherProduct"
        placeholder="商品名を入力してください"
    >

</div>


<!-- =========================
     金額
========================= -->

<label>金額</label>

<input
    type="number"
    id="price"
    placeholder="例：15000"
>


<!-- =========================
     署名日
========================= -->

<label>署名日</label>

<input
    type="date"
    id="delivery"
>


<!-- =========================
     資料写真
========================= -->

<label>お客様から頂いた資料</label>

<div class="photo-info">
    最大3枚まで添付できます
</div>

<input
    type="file"
    id="photoInput"
    accept="image/*"
    capture="environment"
    multiple
    onchange="handlePhotos(event)"
>

<div
    id="photoPreview"
    class="photo-preview"
></div>


<!-- =========================
     備考
========================= -->

<label>備考</label>

<textarea
    id="note"
    placeholder="その他ご要望など"
></textarea>


<!-- =========================
     お客様署名
========================= -->

<label>お客様署名</label>

<canvas id="signature"></canvas>


<button
    type="button"
    class="clear-button"
    onclick="clearSignature()"
>
    署名を書き直す
</button>


<!-- =========================
     保存
========================= -->

<button
    type="button"
    class="save-button"
    onclick="saveOrder()"
>
    注文内容と署名を保存
</button>


</div>


<!-- =========================
     保存済み注文
========================= -->

<div class="card">

<h2>保存済み注文</h2>

<div id="orders">
    まだ注文はありません。
</div>

</div>


</div>


<script>


/* =====================================================
   商品「その他」
===================================================== */

function checkOtherProduct() {

    const product =
        document
        .getElementById("product")
        .value;


    const otherArea =
        document
        .getElementById("otherProductArea");


    const otherInput =
        document
        .getElementById("otherProduct");


    if (product === "その他") {

        otherArea.style.display = "block";

        otherInput.focus();

    } else {

        otherArea.style.display = "none";

        otherInput.value = "";

    }

}


/* =====================================================
   資料写真
===================================================== */

let selectedPhotos = [];


function handlePhotos(event) {

    const files =
        Array.from(event.target.files);


    if (
        selectedPhotos.length + files.length > 3
    ) {

        alert(
            "資料写真は3枚まで添付できます。"
        );

        event.target.value = "";

        return;
    }


    files.forEach(function(file) {

        if (!file.type.startsWith("image/")) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload = function(e) {

            selectedPhotos.push(
                e.target.result
            );


            displayPhotoPreview();

        };


        reader.readAsDataURL(file);

    });


    event.target.value = "";

}


/* =====================================================
   写真プレビュー
===================================================== */

function displayPhotoPreview() {

    const preview =
        document
        .getElementById("photoPreview");


    preview.innerHTML = "";


    selectedPhotos.forEach(
        function(photo, index) {


            const div =
                document.createElement("div");


            div.className =
                "photo-item";


            div.innerHTML = `

                <img
                    src="${photo}"
                    alt="資料写真"
                >

                <button
                    type="button"
                    class="photo-remove"
                    onclick="removePhoto(${index})"
                >
                    ×
                </button>

            `;


            preview.appendChild(div);

        }
    );

}


/* =====================================================
   写真削除
===================================================== */

function removePhoto(index) {

    selectedPhotos.splice(index, 1);

    displayPhotoPreview();

}


/* =====================================================
   署名キャンバス
===================================================== */

const canvas =
    document.getElementById("signature");


const ctx =
    canvas.getContext("2d");


let drawing = false;

let hasSignature = false;


/* =====================================================
   キャンバスサイズ
===================================================== */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * ratio;


    canvas.height =
        rect.height * ratio;


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    ctx.lineWidth = 2;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.strokeStyle = "#000000";

}


resizeCanvas();


/* =====================================================
   マウス署名
===================================================== */

canvas.addEventListener(
    "mousedown",
    function(e) {

        drawing = true;


        const rect =
            canvas.getBoundingClientRect();


        ctx.beginPath();


        ctx.moveTo(
            e.clientX - rect.left,
            e.clientY - rect.top
        );

    }
);


canvas.addEventListener(
    "mousemove",
    function(e) {

        if (!drawing) return;


        const rect =
            canvas.getBoundingClientRect();


        ctx.lineTo(
            e.clientX - rect.left,
            e.clientY - rect.top
        );


        ctx.stroke();


        hasSignature = true;

    }
);


canvas.addEventListener(
    "mouseup",
    function() {

        drawing = false;

    }
);


canvas.addEventListener(
    "mouseleave",
    function() {

        drawing = false;

    }
);


/* =====================================================
   iPadタッチ署名
===================================================== */

canvas.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();


        drawing = true;


        const rect =
            canvas.getBoundingClientRect();


        const touch =
            e.touches[0];


        ctx.beginPath();


        ctx.moveTo(
            touch.clientX - rect.left,
            touch.clientY - rect.top
        );

    },
    { passive: false }
);


canvas.addEventListener(
    "touchmove",
    function(e) {

        e.preventDefault();


        if (!drawing) return;


        const rect =
            canvas.getBoundingClientRect();


        const touch =
            e.touches[0];


        ctx.lineTo(
            touch.clientX - rect.left,
            touch.clientY - rect.top
        );


        ctx.stroke();


        hasSignature = true;

    },
    { passive: false }
);


canvas.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();


        drawing = false;

    },
    { passive: false }
);


/* =====================================================
   署名を消す
===================================================== */

function clearSignature() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    hasSignature = false;

}


/* =====================================================
   注文番号
===================================================== */

function createOrderNumber() {

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            today.getDate()
        ).padStart(2, "0");


    const dateString =
        year + month + day;


    const orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    let count = 0;


    orders.forEach(
        function(order) {

            if (
                order.orderNumber &&
                order.orderNumber.startsWith(
                    dateString
                )
            ) {

                count++;

            }

        }
    );


    const number =
        String(
            count + 1
        ).padStart(3, "0");


    return dateString + "-" + number;

}


/* =====================================================
   注文保存
===================================================== */

function saveOrder() {

    try {


        /* -------------------------
           お客様名
        ------------------------- */

        const name =
            document
            .getElementById("name")
            .value
            .trim();


        /* -------------------------
           商品
        ------------------------- */

        const selectedProduct =
            document
            .getElementById("product")
            .value;


        const otherProduct =
            document
            .getElementById("otherProduct")
            .value
            .trim();


        let product =
            selectedProduct;


        if (
            selectedProduct === "その他"
        ) {

            if (!otherProduct) {

                alert(
                    "その他の商品名を入力してください。"
                );

                return;

            }


            product =
                "その他：" +
                otherProduct;

        }


        /* -------------------------
           金額
        ------------------------- */

        const price =
            document
            .getElementById("price")
            .value
            .trim();


        /* -------------------------
           署名日
        ------------------------- */

        const delivery =
            document
            .getElementById("delivery")
            .value;


        /* -------------------------
           備考
        ------------------------- */

        const note =
            document
            .getElementById("note")
            .value
            .trim();


        /* -------------------------
           お客様名チェック
        ------------------------- */

        if (!name) {

            alert(
                "お客様名を入力してください。"
            );

            return;

        }


        /* -------------------------
           商品チェック
        ------------------------- */

        if (!selectedProduct) {

            alert(
                "商品を選択してください。"
            );

            return;

        }


        /* -------------------------
           署名チェック
        ------------------------- */

        if (!hasSignature) {

            alert(
                "お客様の署名を入力してください。"
            );

            return;

        }


        /* -------------------------
           注文番号
        ------------------------- */

        const orderNumber =
            createOrderNumber();


        /* -------------------------
           署名画像
        ------------------------- */

        const signature =
            canvas.toDataURL(
                "image/png"
            );


        /* -------------------------
           注文データ
        ------------------------- */

        const order = {

            id:
                Date.now(),

            orderNumber:
                orderNumber,

            date:
                new Date()
                .toLocaleString("ja-JP"),

            name:
                name,

            product:
                product,

            price:
                price,

            delivery:
                delivery,

            photos:
                selectedPhotos,

            note:
                note,

            signature:
                signature

        };


        /* -------------------------
           保存済み注文を取得
        ------------------------- */

        let orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];


        /* -------------------------
           新しい注文を追加
        ------------------------- */

        orders.push(order);


        /* -------------------------
           保存
        ------------------------- */

        localStorage.setItem(
            "orders",
            JSON.stringify(orders)
        );


        /* -------------------------
           保存完了
        ------------------------- */

        alert(
            "注文を保存しました。\n\n" +
            "注文番号：" +
            orderNumber
        );


        /* -------------------------
           フォームクリア
        ------------------------- */

        clearForm();


        /* -------------------------
           一覧更新
        ------------------------- */

        displayOrders();


    } catch (error) {


        console.error(error);


        alert(
            "保存中にエラーが発生しました。\n\n" +
            error.message
        );

    }

}


/* =====================================================
   フォームをクリア
===================================================== */

function clearForm() {


    document
    .getElementById("name")
    .value = "";


    document
    .getElementById("product")
    .value = "";


    document
    .getElementById("otherProduct")
    .value = "";


    document
    .getElementById("otherProductArea")
    .style.display = "none";


    document
    .getElementById("price")
    .value = "";


    document
    .getElementById("delivery")
    .value = "";


    document
    .getElementById("note")
    .value = "";


    /* 写真をクリア */

    selectedPhotos = [];


    displayPhotoPreview();


    /* ファイル選択をクリア */

    document
    .getElementById("photoInput")
    .value = "";


    /* 署名をクリア */

    clearSignature();

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHTML(text) {


    if (!text) return "";


    return text
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   保存済み注文を表示
===================================================== */

function displayOrders() {


    const ordersArea =
        document
        .getElementById("orders");


    const orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    /* -------------------------
       注文がない場合
    ------------------------- */

    if (
        orders.length === 0
    ) {

        ordersArea.innerHTML =
            "まだ注文はありません。";

        return;

    }


    /* -------------------------
       新しい注文を上に
    ------------------------- */

    const reversedOrders =
        orders
        .slice()
        .reverse();


    ordersArea.innerHTML = "";


    reversedOrders.forEach(
        function(order) {


            const div =
                document
                .createElement("div");


            div.className =
                "order";


            /* -------------------------
               資料写真
            ------------------------- */

            let photosHTML = "";


            if (
                order.photos &&
                order.photos.length > 0
            ) {


                photosHTML = `

                    <div>

                        <strong>
                            お客様から頂いた資料：
                        </strong>

                        <div class="saved-photos">

                            ${order.photos
                                .map(
                                    function(photo) {

                                        return `

                                            <img
                                                src="${photo}"
                                                alt="資料写真"
                                            >

                                        `;

                                    }
                                )
                                .join("")
                            }

                        </div>

                    </div>

                `;

            }


            /* -------------------------
               注文表示
            ------------------------- */

            div.innerHTML = `


                <div class="order-number">

                    注文番号：
                    ${escapeHTML(
                        order.orderNumber
                    )}

                </div>


                <div>

                    <strong>
                        受付日時：
                    </strong>

                    ${escapeHTML(
                        order.date
                    )}

                </div>


                <div>

                    <strong>
                        お客様名：
                    </strong>

                    ${escapeHTML(
                        order.name
                    )}

                </div>


                <div>

                    <strong>
                        商品：
                    </strong>

                    ${escapeHTML(
                        order.product
                    )}

                </div>


                <div>

                    <strong>
                        金額：
                    </strong>

                    ${escapeHTML(
                        order.price
                    )}

                    円

                </div>


                <div>

                    <strong>
                        署名日：
                    </strong>

                    ${escapeHTML(
                        order.delivery
                    )}

                </div>


                ${photosHTML}


                <div>

                    <strong>
                        備考：
                    </strong>

                    ${escapeHTML(
                        order.note
                    )}

                </div>


                <div>

                    <strong>
                        お客様署名：
                    </strong>

                    <br>


                    <img
                        class="signature-image"
                        src="${order.signature}"
                        alt="お客様署名"
                    >

                </div>


                <button
                    class="delete-button"
                    onclick="deleteOrder(${order.id})"
                >

                    この注文を削除

                </button>


            `;


            ordersArea
            .appendChild(div);

        }
    );

}


/* =====================================================
   注文削除
===================================================== */

function deleteOrder(id) {


    if (
        !confirm(
            "この注文を削除しますか？"
        )
    ) {

        return;

    }


    let orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    orders =
        orders.filter(
            function(order) {

                return order.id !== id;

            }
        );


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    displayOrders();

}


/* =====================================================
   起動時
===================================================== */

displayOrders();

</script>


</body>
</html>
