<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>注文・署名管理</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Helvetica Neue",
"Yu Gothic",
"Hiragino Kaku Gothic ProN",
Arial,
sans-serif;
background: #f3f4f6;
color: #222;
}

button,
input,
textarea {
font-family: inherit;
}

button {
-webkit-tap-highlight-color: transparent;
}

/* =========================
共通
========================= */

.page {
display: none;
min-height: 100vh;
padding: 20px 16px 40px;
}

.page.active {
display: block;
}

.container {
width: 100%;
max-width: 700px;
margin: 0 auto;
}

h1 {
font-size: 26px;
text-align: center;
margin: 10px 0 30px;
}

h2 {
font-size: 22px;
margin: 10px 0 20px;
}

.section-title {
font-size: 18px;
font-weight: bold;
margin: 28px 0 12px;
}

.card {
background: white;
border-radius: 16px;
padding: 20px;
margin-bottom: 16px;
box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

/* =========================
1ページ目
========================= */

.home-buttons {
display: flex;
flex-direction: column;
gap: 18px;
margin-top: 70px;
}

.home-button {
width: 100%;
min-height: 90px;
border: none;
border-radius: 18px;
font-size: 25px;
font-weight: bold;
color: white;
cursor: pointer;
box-shadow: 0 5px 12px rgba(0,0,0,0.15);
}

.home-button:active {
transform: scale(0.98);
}

.btn-sign {
background: #1976d2;
}

.btn-saved {
background: #444;
}

/* =========================
戻るボタン
========================= */

.back-button {
border: none;
background: #777;
color: white;
border-radius: 10px;
padding: 12px 20px;
font-size: 16px;
margin-bottom: 18px;
cursor: pointer;
}

/* =========================
フォーム
========================= */

.form-group {
margin-bottom: 22px;
}

.form-group label {
display: block;
font-weight: bold;
font-size: 17px;
margin-bottom: 9px;
}

input[type="text"],
input[type="date"],
textarea {
width: 100%;
border: 1px solid #ccc;
border-radius: 10px;
padding: 14px;
font-size: 17px;
background: #fff;
}

textarea {
min-height: 110px;
resize: vertical;
}

/* =========================
商品ボタン
========================= */

.product-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 10px;
}

.product-button {
min-height: 58px;
border-radius: 10px;
border: 3px solid transparent;
font-size: 15px;
font-weight: bold;
cursor: pointer;
background: #eee;
transition: 0.15s;
}

.product-button.selected {
box-shadow: 0 0 0 3px rgba(0,0,0,0.15);
transform: scale(1.02);
}

/* 商品カラー */

.product-1 {
background: #f7b7b7;
}

.product-2 {
background: #a9c9f5;
}

.product-3 {
background: #a9e7ee;
}

.product-4 {
background: #d5e98b;
}

.product-5 {
background: #a9dca9;
}

.product-6 {
background: #d0d0d0;
}

.product-7 {
background: #f5c27b;
}

.product-8 {
background: #d8bd91;
}

.product-9 {
background: #c8a9e8;
}

.product-10 {
background: #f0a9ca;
}

.product-11 {
background: #ffffff;
border-color: #ccc;
}

/* =========================
写真
========================= */

.photo-buttons {
display: flex;
gap: 10px;
flex-wrap: wrap;
}

.photo-button {
border: none;
border-radius: 10px;
padding: 13px 16px;
font-size: 16px;
background: #333;
color: white;
cursor: pointer;
}

.photo-list {
display: flex;
flex-wrap: wrap;
gap: 10px;
margin-top: 12px;
}

.photo-item {
position: relative;
width: 105px;
height: 105px;
}

.photo-item img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 10px;
border: 1px solid #ccc;
}

.photo-delete {
position: absolute;
top: -7px;
right: -7px;
width: 30px;
height: 30px;
border-radius: 50%;
border: none;
background: #e53935;
color: white;
font-size: 18px;
font-weight: bold;
}

/* =========================
次へ・保存
========================= */

.primary-button {
width: 100%;
min-height: 60px;
border: none;
border-radius: 13px;
background: #1976d2;
color: white;
font-size: 21px;
font-weight: bold;
cursor: pointer;
margin-top: 20px;
}

.primary-button:active {
transform: scale(0.98);
}

.save-button {
background: #00897b;
}

.cancel-button {
width: 100%;
min-height: 52px;
border: none;
border-radius: 12px;
background: #777;
color: white;
font-size: 18px;
margin-top: 10px;
}

/* =========================
注意事項
========================= */

.notice-box {
background: #fff;
border-radius: 14px;
padding: 18px;
box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.notice-item {
margin-bottom: 18px;
padding-bottom: 18px;
border-bottom: 1px solid #ddd;
}

.notice-item:last-child {
border-bottom: none;
margin-bottom: 0;
}

.notice-label {
display: flex;
gap: 12px;
align-items: flex-start;
font-size: 16px;
line-height: 1.7;
cursor: pointer;
}

.notice-label input {
width: 25px;
height: 25px;
flex-shrink: 0;
margin-top: 2px;
}

.warning {
color: #d60000;
font-weight: bold;
margin-top: 8px;
margin-left: 37px;
line-height: 1.6;
}

/* =========================
署名
========================= */

.signature-area {
background: white;
border-radius: 14px;
padding: 15px;
}

.signature-canvas {
width: 100%;
height: 260px;
border: 2px solid #333;
border-radius: 10px;
background: white;
touch-action: none;
display: block;
}

.signature-buttons {
display: flex;
gap: 10px;
margin-top: 10px;
}

.signature-buttons button {
flex: 1;
min-height: 48px;
border: none;
border-radius: 10px;
background: #777;
color: white;
font-size: 16px;
}

/* =========================
保存済み一覧
========================= */

.search-box {
background: white;
padding: 18px;
border-radius: 14px;
margin-bottom: 18px;
}

.search-buttons {
display: flex;
gap: 10px;
}

.search-buttons button {
flex: 1;
min-height: 50px;
border: none;
border-radius: 10px;
font-size: 17px;
font-weight: bold;
}

.search-button {
background: #1976d2;
color: white;
}

.reset-button {
background: #777;
color: white;
}

.result-count {
font-weight: bold;
margin: 15px 0;
}

.order-card {
background: white;
border-radius: 14px;
padding: 18px;
margin-bottom: 15px;
box-shadow: 0 3px 10px rgba(0,0,0,0.07);
}

.order-header {
font-size: 18px;
font-weight: bold;
margin-bottom: 12px;
}

.order-info {
line-height: 1.8;
}

.order-actions {
display: flex;
gap: 10px;
margin-top: 15px;
}

.order-actions button {
flex: 1;
min-height: 46px;
border: none;
border-radius: 9px;
color: white;
font-size: 16px;
}

.view-button {
background: #1976d2;
}

.edit-button {
background: #00897b;
}

.delete-button {
background: #e53935;
}

/* =========================
詳細モーダル
========================= */

.modal {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.6);
display: none;
align-items: flex-start;
justify-content: center;
overflow-y: auto;
padding: 20px;
z-index: 1000;
}

.modal.active {
display: flex;
}

.modal-content {
width: 100%;
max-width: 700px;
background: #f5f5f5;
border-radius: 16px;
padding: 20px;
margin: auto;
}

.modal-title {
font-size: 22px;
font-weight: bold;
margin-bottom: 20px;
}

.locked-box {
background: #eee;
border: 1px solid #ccc;
padding: 14px;
border-radius: 10px;
color: #555;
}

.detail-photo-grid {
display: flex;
flex-wrap: wrap;
gap: 10px;
}

.detail-photo-grid img {
width: 120px;
height: 120px;
object-fit: cover;
border-radius: 10px;
}

.detail-signature {
width: 100%;
border: 1px solid #ccc;
border-radius: 10px;
background: white;
}

.close-modal {
width: 100%;
min-height: 52px;
border: none;
border-radius: 10px;
background: #555;
color: white;
font-size: 18px;
margin-top: 20px;
}

/* =========================
レスポンシブ
========================= */

@media (min-width: 600px) {
.page {
padding-top: 35px;
}

.home-buttons {
max-width: 500px;
margin-left: auto;
margin-right: auto;
}

.product-grid {
grid-template-columns: repeat(3, 1fr);
}
}
</style>
</head>

<body>

<!-- =====================================================
1ページ目：ホーム
===================================================== -->

<div id="homePage" class="page active">
<div class="container">

<h1>署名管理</h1>

<div class="home-buttons">

<button
id="goSignButton"

署名画面へ
</button>

<button
id="savedOrdersButton"

署名保存済
</button>

</div>

</div>
</div>


<!-- =====================================================
2ページ目：お客様情報
===================================================== -->

<div id="orderPage" class="page">
<div class="container">

<button
id="orderBackButton"
class="back-button">
← 戻る
</button>

<h1>お客様情報</h1>

<div class="card">

<label for="customerName">

<input
type="text"

<label>
商品
</label>

</button>

<button class="product-button product-2"

② 印鑑
</button>

<button class="product-button product-3"

③ スタンプ・ゴム印
</button>

<button class="product-button product-4"
data-product="④ 封筒">
④ 封筒
</button>

<button class="product-button product-5"
data-product="⑤ チラシ・パンフレット">
⑤ チラシ・パンフレット
</button>

<button class="product-button product-6"
data-product="⑥ ホームページ">
⑥ ホームページ
</button>

<button class="product-button product-7"
data-product="⑦ 入稿データ">
⑦ 入稿データ
</button>

<button class="product-button product-8"
data-product="⑧ 伝票">
⑧ 伝票
</button>

<button class="product-button product-9"
data-product="⑨ オーダーメイド依頼">
⑨ オーダーメイド依頼
</button>

<button class="product-button product-10"
data-product="⑩ オーダーメイド決定">
⑩ オーダーメイド決定
</button>

<button class="product-button product-11"
data-product="⑪ 持込印材">
⑪ 持込印材
</button>

</div>

</div>


<!-- 受付日 -->
<div class="form-group">

<label for="delivery">
受付日
</label>

<input
type="date"
id="delivery">

</div>


<!-- 写真 -->
<div class="form-group">

<label>
お客様提供資料の写真
</label>

<div class="photo-buttons">

<button
type="button"
id="cameraButton"

</button>

<button
type="button"
id="photoButton"

</button>

</div>

<input
type="file"
id="cameraInput"
accept="image/*"

<input
type="file"
id="photoInput"

multiple
style="display:none;">

<div
id="photoList"
class="photo-list">
</div>

</div>


<!-- 備考 -->
<div class="form-group">

<label for="notes">
備考
</label>

<textarea
id="notes"
placeholder="備考があれば入力してください"></textarea>

</div>


<button
id="nextButton"
class="primary-button">
次へ
</button>

</div>

</div>
</div>


<!-- =====================================================
3ページ目：注意事項＋署名

<div id="signaturePage" class="page">
<div class="container">

<button
id="signatureBackButton"
class="back-button">
← 戻る

<button
id="clearSignatureButton">

</button>

</div>

</div>


<button
id="saveOrderButton"
class="primary-button save-button">
保存する
</button>

</div>

</div>
</div>


<!-- =====================================================
保存済み一覧ページ
===================================================== -->

<div id="savedPage" class="page">
<div class="container">

<button
id="savedBackButton"
class="back-button">

<div class="form-group">

id="searchDate">

</div>


<div

<button

</div>

function generateOrderNumber() {

const today = getToday();

const todayText = today.replace(/-/g, "");

const orders = getOrders();

const count = orders.filter(order =>
order.orderNumber &&
order.orderNumber.startsWith(todayText)
).length;

const number = String(count + 1).padStart(3, "0");

return `${todayText}-${number}`;
}


/* =====================================================
写真圧縮
===================================================== */

function compressImage(file) {

return new Promise((resolve, reject) => {

const reader = new FileReader();

reader.onload = function(event) {

const img = new Image();

img.onload = function() {

const maxSize = 1200;

let width = img.width;
let height = img.height;

if (width > maxSize || height > maxSize) {

if (width > height) {

height =
Math.round(
height * maxSize / width
);

width = maxSize;

} else {

width =
Math.round(
width * maxSize / height
);

height = maxSize;

}
}

const canvas =
document.createElement("canvas");

canvas.width = width;
canvas.height = height;

const ctx = canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.75
)
);

};

img.onerror = reject;

img.src = event.target.result;
};

reader.onerror = reject;

reader.readAsDataURL(file);

});

}

async function addPhotos(files, targetArray, renderFunction) {

const fileArray = Array.from(files);

const remaining =
3 - targetArray.length;

if (remaining <= 0) {

alert("写真は最大3枚までです。");

return;

}

const filesToAdd =
fileArray.slice(0, remaining);

for (const file of filesToAdd) {

try {

const compressed =
await compressImage(file);

targetArray.push(compressed);

} catch (error) {

console.error(error);

}
}

renderFunction();
}

/* =====================================================
署名キャンバス
===================================================== */

const canvas =
document.getElementById(
"signatureCanvas"
);

const ctx =
canvas.getContext("2d");


let drawing = false;

let lastX = 0;
let lastY = 0;


function setupCanvas() {

const rect =
canvas.getBoundingClientRect();

const ratio =
window.devicePixelRatio || 1;

canvas.width =
rect.width * ratio;

canvas.height =
rect.height * ratio;

ctx.setTransform(
ratio,
0,
0,
ratio,
0,
0
);

ctx.lineWidth = 2.5;

ctx.lineCap = "round";

ctx.lineJoin = "round";

ctx.strokeStyle = "#111";

}


function getPointerPosition(event) {

const rect =
canvas.getBoundingClientRect();

return {
x: event.clientX - rect.left,
y: event.clientY - rect.top
};

}


canvas.addEventListener(
"pointerdown",
event => {

event.preventDefault();

drawing = true;

const pos =
getPointerPosition(event);

lastX = pos.x;
lastY = pos.y;

canvas.setPointerCapture(
event.pointerId
);

}
);


canvas.addEventListener(
"pointermove",
event => {

if (!drawing) return;

event.preventDefault();

const pos =
getPointerPosition(event);

ctx.beginPath();

ctx.moveTo(
lastX,
lastY
);

ctx.lineTo(
pos.x,
pos.y
);

ctx.stroke();

lastX = pos.x;
lastY = pos.y;

}
);


canvas.addEventListener(
"pointerup",
event => {

drawing = false;

try {

canvas.releasePointerCapture(
event.pointerId
);

} catch(e) {}

}
);


canvas.addEventListener(
"pointercancel",
() => {

drawing = false;

}
);


function clearSignature() {

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

setupCanvas();

}


function hasSignature() {

const data =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
).data;

for (
let i = 3;
i < data.length;
i += 4
) {

if (data[i] > 0) {

return true;

}

}

return false;

}

"searchName"
).value
.trim()
.toLowerCase();


const product =
document.getElementById(
"searchProduct"
).value;


const orders =
getOrders();


const filtered =
orders.filter(order => {

const matchDate =
!date ||
order.delivery === date;


const matchName =
!name ||
(order.customerName || "")
.toLowerCase()
.includes(name);


const matchProduct =
!product ||
order.product === product;


return (
matchDate &&
matchName &&
matchProduct
);

});


renderSavedOrders(
filtered
);

}

/* =====================================================
削除
===================================================== */

function deleteOrder(order) {

const result =
confirm(
`「${order.customerName}」の署名データを削除しますか？`
);


if (!result) return;


const key =
getOrderKey(order);


const orders =
getOrders().filter(
item =>
getOrderKey(item)
!== key
);


saveOrders(
orders
);


searchOrders();

}


/* =====================================================
編集
===================================================== */

function openEditModal(order) {

editingOrderKey =
getOrderKey(order);


document.getElementById(
"editCustomerName"
).value =
order.customerName || "";


document.getElementById(
"editDelivery"
).value =
order.delivery || "";


document.getElementById(
"editProduct"
).textContent =
`${order.product}（変更できません）`;


document.getElementById(
"editNotes"
).value =
order.notes || "";


editPhotos =
order.photos
? [...order.photos]
: [];


renderEditPhotos();


document.getElementById(
"editModal"
).classList.add(
"active"
);

}


/* =====================================================
編集写真表示
===================================================== */

function renderEditPhotos() {

const list =
document.getElementById(
"editPhotoList"
);

list.innerHTML = "";


editPhotos.forEach(
(photo, index) => {

const div =
document.createElement("div");

div.className =
"photo-item";


div.innerHTML = `

<img src="${photo}">

<button
class="photo-delete"
data-index="${index}">
×
</button>

`;


list.appendChild(div);

}
);


list.querySelectorAll(
".photo-delete"
).forEach(button => {

button.addEventListener(
"click",
() => {

const index =
Number(
button.dataset.index
);

editPhotos.splice(
index,
1
);

renderEditPhotos();

}
);

});

}

/* =====================================================
編集保存
===================================================== */

document.getElementById(
"updateOrderButton"
).addEventListener(
"click",
() => {

const customerName =
document.getElementById(
"editCustomerName"
).value.trim();


const delivery =
document.getElementById(
"editDelivery"
).value;


const notes =
document.getElementById(
"editNotes"
).value.trim();


if (!customerName) {

alert(
"お客様名または会社名を入力してください。"
);

return;

}


if (!delivery) {

alert(
"受付日を入力してください。"
);

return;

}


const orders =
getOrders();


const index =
orders.findIndex(
order =>
getOrderKey(order)
=== editingOrderKey
);


if (index === -1) {

alert(
"対象データが見つかりません。"
);

return;

}


/*
* 編集できるのは
*
* ・お客様名
* ・受付日
* ・写真
* ・備考
*
* のみ。
*
* 商品・署名・注意事項・注文番号は
* 変更しない。
*/

orders[index].customerName =
customerName;


orders[index].delivery =
delivery;


orders[index].photos =
[...editPhotos];


orders[index].notes =
notes;


saveOrders(
orders
);


alert(
"保存内容を更新しました。"
);


document.getElementById(
"editModal"
).classList.remove(
"active"
);


editingOrderKey = null;


searchOrders();

}
);

/* =====================================================
HTMLエスケープ
===================================================== */

function escapeHtml(value) {

if (value === null ||
value === undefined) {

return "";

}


return String(value)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}
