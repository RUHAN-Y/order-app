<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>注文受付</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#f2f2f2;
    color:#222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
}

body{
    padding-bottom:40px;
}

.container{
    width:100%;
    max-width:760px;
    margin:0 auto;
    background:#fff;
    min-height:100vh;
    padding:20px;
}

h1{
    margin:0 0 20px;
    text-align:center;
    font-size:26px;
}

h2{
    font-size:21px;
    margin:0 0 16px;
}

h3{
    font-size:18px;
    margin:0 0 12px;
}

.form-group{
    margin-bottom:24px;
}

label{
    display:block;
    font-size:16px;
    font-weight:bold;
    margin-bottom:8px;
}

input[type="text"],
input[type="date"],
textarea,
select{
    width:100%;
    min-height:52px;
    padding:12px;
    font-size:17px;
    border:2px solid #ccc;
    border-radius:10px;
    background:#fff;
    color:#222;
    outline:none;
}

textarea{
    min-height:110px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#555;
}

/* =========================
   商品
========================= */

.product-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.product-btn{
    min-height:62px;
    padding:10px;
    border:3px solid #ccc;
    border-radius:12px;
    background:#fff;
    color:#222;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.product-btn:active{
    transform:scale(.97);
}

.product-btn.selected{
    box-shadow:0 0 0 3px rgba(0,0,0,.12);
}

.product-1{border-color:#e53935}
.product-1.selected{background:#ffebee}

.product-2{border-color:#1976d2}
.product-2.selected{background:#e3f2fd}

.product-3{border-color:#29b6f6}
.product-3.selected{background:#e1f5fe}

.product-4{border-color:#9ccc65}
.product-4.selected{background:#f1f8e9}

.product-5{border-color:#43a047}
.product-5.selected{background:#e8f5e9}

.product-6{border-color:#777}
.product-6.selected{background:#eeeeee}

.product-7{border-color:#fb8c00}
.product-7.selected{background:#fff3e0}

.product-8{border-color:#c49a6c}
.product-8.selected{background:#f5eadf}

.product-9{border-color:#8e44ad}
.product-9.selected{background:#f3e5f5}

.product-10{border-color:#ec407a}
.product-10.selected{background:#fce4ec}

.product-11{border-color:#222}
.product-11.selected{background:#f5f5f5}

/* =========================
   日付・備考
========================= */

.date-area{
    margin-bottom:28px;
}

.notes-area{
    margin-bottom:28px;
}

/* =========================
   写真
========================= */

.photo-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:12px;
}

.photo-btn{
    min-height:58px;
    border:2px solid #555;
    border-radius:10px;
    background:#f7f7f7;
    font-size:16px;
    font-weight:bold;
}

.photo-preview{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.photo-preview-item{
    position:relative;
}

.photo-preview img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:8px;
    border:1px solid #ccc;
}

.photo-remove{
    position:absolute;
    right:4px;
    top:4px;
    width:30px;
    height:30px;
    min-height:30px;
    padding:0;
    border:0;
    border-radius:50%;
    background:#d32f2f;
    color:#fff;
    font-size:18px;
    font-weight:bold;
}

/* =========================
   注意事項
========================= */

#noticeArea{
    display:none;
    margin-bottom:28px;
}

.notice-box{
    border:2px solid #ddd;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    background:#fafafa;
}

.notice-label{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-weight:normal;
    margin:0;
    line-height:1.6;
}

.notice-label input{
    width:24px;
    height:24px;
    flex-shrink:0;
    margin-top:2px;
}

.notice-warning{
    color:#d32f2f;
    font-weight:bold;
    margin-top:8px;
    padding-left:34px;
    line-height:1.5;
}

/* =========================
   署名
========================= */

.signature-area{
    margin-bottom:28px;
}

.signature-wrap{
    border:2px solid #aaa;
    border-radius:10px;
    background:#fff;
    overflow:hidden;
}

#signatureCanvas{
    display:block;
    width:100%;
    height:220px;
    background:#fff;
    touch-action:none;
}

.signature-buttons{
    display:flex;
    gap:10px;
    padding:10px;
    border-top:1px solid #ddd;
}

.signature-buttons button{
    flex:1;
}

.clear-btn{
    min-height:48px;
    border:2px solid #999;
    border-radius:8px;
    background:#f5f5f5;
    font-size:15px;
    font-weight:bold;
}

/* =========================
   保存
========================= */

.save-btn{
    width:100%;
    min-height:64px;
    border:0;
    border-radius:12px;
    background:#222;
    color:#fff;
    font-size:20px;
    font-weight:bold;
    margin-bottom:35px;
}

.save-btn:active{
    background:#555;
}

/* =========================
   保存済み
========================= */

.saved-section{
    border-top:3px solid #222;
    padding-top:25px;
}

/* =========================
   検索
========================= */

.search-box{
    background:#f7f7f7;
    border:2px solid #ddd;
    border-radius:14px;
    padding:16px;
    margin-bottom:18px;
}

.search-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:15px;
}

.search-group{
    margin-bottom:14px;
}

.search-group:last-child{
    margin-bottom:0;
}

.search-group label{
    font-size:15px;
    margin-bottom:6px;
}

.search-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.search-btn{
    min-height:52px;
    border:2px solid #333;
    border-radius:9px;
    background:#333;
    color:#fff;
    font-size:16px;
    font-weight:bold;
}

.reset-search-btn{
    min-height:52px;
    border:2px solid #888;
    border-radius:9px;
    background:#fff;
    color:#222;
    font-size:16px;
    font-weight:bold;
}

.search-result-count{
    font-size:15px;
    font-weight:bold;
    margin:15px 0;
    padding:10px 12px;
    border-radius:8px;
    background:#eee;
}

/* =========================
   注文カード
========================= */

.order-card{
    border:2px solid #ddd;
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
    background:#fff;
}

.order-number{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.order-info{
    line-height:1.8;
    margin-bottom:12px;
}

.order-product{
    display:inline-block;
    padding:5px 10px;
    border-radius:7px;
    background:#eee;
    font-weight:bold;
    margin-bottom:8px;
}

.saved-photos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:12px 0;
}

.saved-photos img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:8px;
    border:1px solid #ccc;
}

.saved-signature{
    margin-top:12px;
}

.saved-signature-title{
    font-weight:bold;
    margin-bottom:6px;
}

.saved-signature img{
    width:100%;
    max-height:220px;
    object-fit:contain;
    border:1px solid #ccc;
    border-radius:8px;
    background:#fff;
}

.saved-notices{
    margin-top:14px;
    padding:12px;
    border-radius:8px;
    background:#f5f5f5;
    font-size:13px;
    line-height:1.6;
}

.order-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
}

.edit-btn{
    min-height:48px;
    border:2px solid #1976d2;
    border-radius:9px;
    background:#fff;
    color:#1976d2;
    font-size:16px;
    font-weight:bold;
}

.delete-btn{
    min-height:48px;
    border:2px solid #d32f2f;
    border-radius:9px;
    background:#fff;
    color:#d32f2f;
    font-size:16px;
    font-weight:bold;
}

.no-result{
    text-align:center;
    padding:30px 10px;
    color:#777;
}

/* =========================
   編集画面
========================= */

#editModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:1000;
    overflow-y:auto;
    padding:20px 10px;
}

.edit-modal-box{
    width:100%;
    max-width:700px;
    margin:0 auto;
    background:#fff;
    border-radius:16px;
    padding:20px;
}

.edit-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
    text-align:center;
}

.locked-box{
    border:2px solid #ddd;
    border-radius:10px;
    padding:14px;
    background:#f5f5f5;
    margin-bottom:20px;
}

.locked-title{
    font-weight:bold;
    margin-bottom:8px;
}

.locked-text{
    font-size:14px;
    color:#555;
    line-height:1.6;
}

.edit-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.edit-save-btn{
    min-height:56px;
    border:0;
    border-radius:10px;
    background:#222;
    color:#fff;
    font-size:17px;
    font-weight:bold;
}

.edit-cancel-btn{
    min-height:56px;
    border:2px solid #888;
    border-radius:10px;
    background:#fff;
    font-size:17px;
    font-weight:bold;
}

/* 編集署名 */

.edit-signature{
    margin-top:10px;
}

.edit-signature img{
    width:100%;
    max-height:220px;
    object-fit:contain;
    border:1px solid #ccc;
    border-radius:8px;
    background:#fff;
}

/* =========================
   スマホ
========================= */

@media(max-width:600px){

    .container{
        padding:15px;
    }

    .product-btn{
        font-size:14px;
        min-height:58px;
    }

    .photo-buttons{
        grid-template-columns:1fr;
    }

    .search-buttons{
        grid-template-columns:1fr;
    }

    .order-buttons{
        grid-template-columns:1fr 1fr;
    }

    .edit-actions{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>注文受付</h1>

<!-- =========================
     お客様名
========================= -->

<div class="form-group">

<label for="customerName">
お客様名または会社名
</label>

<input
    type="text"
    id="customerName"
    placeholder="例：株式会社〇〇・山田太郎"
>

</div>


<!-- =========================
     商品カテゴリー
========================= -->

<div class="form-group">

<label>
商品カテゴリー
</label>

<div class="product-grid">

<button type="button" class="product-btn product-1" data-product="① 名刺">① 名刺</button>

<button type="button" class="product-btn product-2" data-product="② 印鑑">② 印鑑</button>

<button type="button" class="product-btn product-3" data-product="③ スタンプ・ゴム印">③ スタンプ・ゴム印</button>

<button type="button" class="product-btn product-4" data-product="④ 封筒">④ 封筒</button>

<button type="button" class="product-btn product-5" data-product="⑤ チラシ・パンフレット">⑤ チラシ・パンフレット</button>

<button type="button" class="product-btn product-6" data-product="⑥ ホームページ">⑥ ホームページ</button>

<button type="button" class="product-btn product-7" data-product="⑦ 入稿データ">⑦ 入稿データ</button>

<button type="button" class="product-btn product-8" data-product="⑧ 伝票">⑧ 伝票</button>

<button type="button" class="product-btn product-9" data-product="⑨ オーダーメイド依頼">⑨ オーダーメイド依頼</button>

<button type="button" class="product-btn product-10" data-product="⑩ オーダーメイド決定">⑩ オーダーメイド決定</button>

<button type="button" class="product-btn product-11" data-product="⑪ 持込印材">⑪ 持込印材</button>

</div>

</div>


<!-- =========================
     受付日
========================= -->

<div class="form-group date-area">

<label for="delivery">
受付日
</label>

<input type="date" id="delivery">

</div>


<!-- =========================
     注意事項
========================= -->

<div id="noticeArea">

<h3>注意事項</h3>

<div id="noticeList"></div>

</div>


<!-- =========================
     写真
========================= -->

<div class="form-group">

<label>
お客様ご用意の材料・参考資料
</label>

<div class="photo-buttons">

<button type="button" class="photo-btn" id="cameraButton">
📷 カメラで撮影
</button>

<button type="button" class="photo-btn" id="photoButton">
🖼 写真から選ぶ
</button>

</div>

<input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
    style="display:none"
>

<input
    type="file"
    id="photoInput"
    accept="image/*"
    multiple
    style="display:none"
>

<div id="photoPreview" class="photo-preview"></div>

</div>


<!-- =========================
     備考
========================= -->

<div class="form-group notes-area">

<label for="notes">
備考
</label>

<textarea
    id="notes"
    placeholder="ご注文に関する内容などを入力してください"
></textarea>

</div>


<!-- =========================
     署名
========================= -->

<div class="signature-area">

<label>
お客様署名
</label>

<div class="signature-wrap">

<canvas id="signatureCanvas"></canvas>

<div class="signature-buttons">

<button
    type="button"
    class="clear-btn"
    id="clearSignature">
署名を消す
</button>

</div>

</div>

</div>


<!-- =========================
     保存
========================= -->

<button
    type="button"
    class="save-btn"
    id="saveButton">
注文を保存する
</button>


<!-- =========================
     保存済み注文
========================= -->

<div class="saved-section">

<h2>保存済み注文</h2>


<!-- 検索 -->

<div class="search-box">

<div class="search-title">
🔎 過去の注文を検索
</div>

<div class="search-group">

<label for="searchDate">
① 日付検索
</label>

<input type="date" id="searchDate">

</div>


<div class="search-group">

<label for="searchName">
② 名前または会社名検索
</label>

<input
    type="text"
    id="searchName"
    placeholder="例：田中"
>

</div>


<div class="search-group">

<label for="searchProduct">
③ 商品カテゴリー検索
</label>

<select id="searchProduct">

<option value="">
すべての商品カテゴリー
</option>

<option value="① 名刺">① 名刺</option>
<option value="② 印鑑">② 印鑑</option>
<option value="③ スタンプ・ゴム印">③ スタンプ・ゴム印</option>
<option value="④ 封筒">④ 封筒</option>
<option value="⑤ チラシ・パンフレット">⑤ チラシ・パンフレット</option>
<option value="⑥ ホームページ">⑥ ホームページ</option>
<option value="⑦ 入稿データ">⑦ 入稿データ</option>
<option value="⑧ 伝票">⑧ 伝票</option>
<option value="⑨ オーダーメイド依頼">⑨ オーダーメイド依頼</option>
<option value="⑩ オーダーメイド決定">⑩ オーダーメイド決定</option>
<option value="⑪ 持込印材">⑪ 持込印材</option>

</select>

</div>


<div class="search-buttons">

<button
    type="button"
    class="search-btn"
    id="searchButton">
🔎 検索
</button>

<button
    type="button"
    class="reset-search-btn"
    id="resetSearchButton">
検索条件をクリア
</button>

</div>

</div>


<div
    id="searchResultCount"
    class="search-result-count">
保存済み注文：0件
</div>


<div id="savedOrders"></div>

</div>

</div>


<!-- =========================
     編集モーダル
========================= -->

<div id="editModal">

<div class="edit-modal-box">

<div class="edit-title">
✏️ 注文情報を編集
</div>


<div class="form-group">

<label>
注文番号
</label>

<input
    type="text"
    id="editOrderNumber"
    disabled
>

</div>


<div class="form-group">

<label for="editCustomerName">
お客様名または会社名
</label>

<input
    type="text"
    id="editCustomerName"
>

</div>


<div class="form-group">

<label>
商品カテゴリー
</label>

<div
    class="product-grid"
    id="editProductGrid">
</div>

</div>


<div class="form-group">

<label for="editDelivery">
受付日
</label>

<input
    type="date"
    id="editDelivery"
>

</div>


<div class="form-group">

<label>
お客様ご用意の材料・参考資料
</label>

<div class="photo-buttons">

<button
    type="button"
    class="photo-btn"
    id="editCameraButton">
📷 カメラで撮影
</button>

<button
    type="button"
    class="photo-btn"
    id="editPhotoButton">
🖼 写真から選ぶ
</button>

</div>

<input
    type="file"
    id="editCameraInput"
    accept="image/*"
    capture="environment"
    style="display:none"
>

<input
    type="file"
    id="editPhotoInput"
    accept="image/*"
    multiple
    style="display:none"
>

<div
    id="editPhotoPreview"
    class="photo-preview">
</div>

</div>


<div class="form-group">

<label for="editNotes">
備考
</label>

<textarea id="editNotes"></textarea>

</div>


<!-- 署名固定 -->

<div class="locked-box">

<div class="locked-title">
🔒 お客様署名
</div>

<div class="locked-text">

保存済みのお客様署名です。<br>
署名は編集・変更できません。

<div class="edit-signature">

<img
    id="editSignaturePreview"
    alt="保存済み署名"
>

</div>

</div>

</div>


<!-- 注意事項固定 -->

<div class="locked-box">

<div class="locked-title">
🔒 注意事項
</div>

<div class="locked-text">

保存時の注意事項の確認状態を保持しています。<br>
注意事項のチェック状態・内容は編集できません。

<div id="editNoticePreview"></div>

</div>

</div>


<div class="edit-actions">

<button
    type="button"
    class="edit-save-btn"
    id="editSaveButton">
変更を保存
</button>

<button
    type="button"
    class="edit-cancel-btn"
    id="editCancelButton">
キャンセル
</button>

</div>

</div>

</div>


<script>

/* =====================================================
   商品カテゴリー
===================================================== */

const products = [

    "① 名刺",
    "② 印鑑",
    "③ スタンプ・ゴム印",
    "④ 封筒",
    "⑤ チラシ・パンフレット",
    "⑥ ホームページ",
    "⑦ 入稿データ",
    "⑧ 伝票",
    "⑨ オーダーメイド依頼",
    "⑩ オーダーメイド決定",
    "⑪ 持込印材"

];

let selectedProduct = "";

let selectedPhotos = [];

let editingOrderKey = null;

let editSelectedProduct = "";

let editSelectedPhotos = [];


/* =====================================================
   注意事項
===================================================== */

const notices = {

"① 名刺":[

`弊社作成の版下データ及び弊社で改変を行った入稿データの、著作権は弊社に帰属し、データのお渡し出来ない事を了承します。`,

`弊社での作業の有無にかかわらず、最終の原稿正誤チェックはお客様によるものとさせて頂くことに了承します。`,

/* =====================================================
   今日の日付
===================================================== */

function getToday(){

    const now = new Date();

    const y = now.getFullYear();

    const m =
        String(now.getMonth()+1)
        .padStart(2,"0");

    const d =
        String(now.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${d}`;

}

delivery.value = getToday();

===================================================== */

document
.querySelectorAll(".product-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".product-btn")
            .forEach(btn =>
                btn.classList.remove("selected")
            );

            this.classList.add("selected");

            selectedProduct =
                this.dataset.product;

            renderNotices();

        }
    );

});


/* =====================================================
   注意事項表示
===================================================== */

function renderNotices(){

    noticeList.innerHTML = "";

    const current =
        notices[selectedProduct];

    if(!current || current.length === 0){

        noticeArea.style.display =
            "none";

        return;
    }

    noticeArea.style.display =
        "block";


    current.forEach(
        (notice,index)=>{

            const box =
                document.createElement("div");

            box.className =
                "notice-box";

            const text =
                typeof notice === "string"
                ? notice
                : notice.text;

            const warning =
                typeof notice === "object"
                ? notice.warning
                : "";

            box.innerHTML = `

                <label class="notice-label">

                    <input
                        type="checkbox"
                        class="notice-check"
                        id="noticeCheck-${index}"
                    >

                    <span>
                        ${escapeHTML(text)}
                    </span>

                </label>

                ${
                    warning
                    ?
                    `<div class="notice-warning">
                        ⚠ ${escapeHTML(warning)}
                    </div>`
                    :
                    ""
                }

            `;

            noticeList.appendChild(box);

        }
    );

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function handlePhotos(files){

    const fileArray =
        Array.from(files);

    if(
        selectedPhotos.length +
        fileArray.length > 3
    ){

        alert(
            "写真は最大3枚まで保存できます。"
        );

        return;
    }

    fileArray.forEach(file => {

        compressImage(file)
        .then(dataURL => {

            selectedPhotos.push(dataURL);

            renderPhotoPreview();

        });

    });

}


function compressImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload =
                function(e){

                    const img =
                        new Image();

                    img.onload =
                        function(){

                            const maxSize =
                                1200;

                            let width =
                                img.width;

                            let height =
                                img.height;

                            if(width > maxSize){

                                height =
                                    Math.round(
                                        height *
                                        maxSize /
                                        width
                                    );

                                width =
                                    maxSize;
                            }

                            if(height > maxSize){

                                width =
                                    Math.round(
                                        width *
                                        maxSize /
                                        height
                                    );

                                height =
                                    maxSize;
                            }

                            const canvas =
                                document
                                .createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;

                            const ctx =
                                canvas
                                .getContext("2d");

                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );

                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.75
                                )
                            );

                        };

                    img.onerror =
                        reject;

                    img.src =
                        e.target.result;

                };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );

}


function renderPhotoPreview(){

                }
            );

            photoPreview.appendChild(item);

        }
    );

}


/* =====================================================
   署名
===================================================== */

const canvas =
    document.getElementById(
        "signatureCanvas"
    );

const ctx =
    canvas.getContext("2d");

let drawing = false;


function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * ratio;

    canvas.height =
        rect.height * ratio;

    ctx.scale(
        ratio,
        ratio
    );

    ctx.lineWidth = 2.5;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.strokeStyle =
        "#111";

}

resizeCanvas();


function getPosition(e){

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            e.clientX -
            rect.left,

        y:
            e.clientY -
            rect.top

    };

}


canvas.addEventListener(
    "pointerdown",
    function(e){

        drawing = true;

        const pos =
            getPosition(e);

        ctx.beginPath();

        ctx.moveTo(
            pos.x,
            pos.y
        );

    }
);


canvas.addEventListener(
    "pointermove",
    function(e){

        if(!drawing) return;

        const pos =
            getPosition(e);

        ctx.lineTo(
            pos.x,
            pos.y
        );

        ctx.stroke();

    }
);


canvas.addEventListener(
    "pointerup",
    function(){

        drawing = false;

        ctx.closePath();

    }
);


canvas.addEventListener(
    "pointerleave",
    function(){

        drawing = false;

    }
);


document
.getElementById("clearSignature")
.addEventListener(
    "click",
    clearSignature
);


function clearSignature(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}

   LocalStorage
===================================================== */

const STORAGE_KEY =
    "orderAppOrders";


function getOrders(){

    try{

        return JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            ) || "[]"
        );

    }catch(e){

        return [];

    }

}


function saveOrders(orders){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(orders)
    );

}


/* =====================================================
   注文番号
===================================================== */

function createOrderNumber(date){

    const orders =
        getOrders();

    const sameDay =
        orders.filter(
            order =>
                order.delivery === date
        );

    const number =
        String(
            sameDay.length + 1
        ).padStart(3,"0");

    return date.replace(/-/g,"")
        + "-"
        + number;

}

   署名チェック
===================================================== */

function hasSignature(){

    const pixels =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        ).data;

    for(
        let i=3;
        i<pixels.length;
        i+=4
    ){

        if(pixels[i] !== 0){

            return true;

        }

    }

    return false;

}

function saveOrder(){

    if(!customerName.value.trim()){

        alert(
            "お客様名または会社名を入力してください。"
        );

        return;
    }


    if(!selectedProduct){

        alert(
            "商品カテゴリーを選択してください。"
        );

        return;
    }


    if(!delivery.value){

        alert(
            "受付日を入力してください。"
        );

        return;
    }


    const currentNotices =
        notices[selectedProduct] || [];


    if(currentNotices.length > 0){

        const checks =
            document.querySelectorAll(
                ".notice-check"
            );

        const allChecked =
            Array.from(checks)
            .every(
                check =>
                    check.checked
            );

        if(!allChecked){

            alert(
                "注意事項をすべて確認し、チェックしてください。"
            );

            return;
        }

    }


    if(!hasSignature()){

        alert(
            "お客様の署名を入力してください。"
        );

        return;
    }


    const orders =
        getOrders();


    const order = {

        orderNumber:
            createOrderNumber(
                delivery.value
            ),

        customerName:
            customerName.value.trim(),

        product:
            selectedProduct,

        delivery:
            delivery.value,

        notes:
            notes.value.trim(),

        photos:
            selectedPhotos.slice(),

        signature:
            canvas.toDataURL(
                "image/png"
            ),

        noticesAgreed:
            currentNotices.length > 0,

        noticeTexts:
            currentNotices.map(
                notice =>
                    typeof notice === "string"
                    ? notice
                    : notice.text
            ),

        createdAt:
            new Date().toISOString()

    };


    orders.unshift(order);


    try{

        saveOrders(orders);

    }catch(e){

        alert(
            "保存容量を超えた可能性があります。\n写真を減らして再度お試しください。"
        );

        return;

    }


    alert(
        "注文を保存しました。\n\n注文番号：" +
        order.orderNumber
    );


    resetForm();

    displayOrders();

}

===================================================== */

function searchOrders(){

    const date =
        searchDate.value;

    const name =
        searchName.value
        .trim()
        .toLowerCase();

    const product =
        searchProduct.value;

    const orders =
        getOrders();

    const filtered =
        orders.filter(order => {

            if(
                date &&
                order.delivery !== date
            ){

                return false;

            }


            if(name){

                const customer =
                    String(
                        order.customerName || ""
                    )
                    .toLowerCase();

                if(
                    !customer.includes(name)
                ){

                    return false;

                }

            }


            if(
                product &&
                order.product !== product
            ){

                return false;

            }


            return true;

        });


    displayFilteredOrders(
        filtered
    );

}

        getOrders()
    );

}


function displayFilteredOrders(
    orders
){

    savedOrders.innerHTML = "";

    searchResultCount.textContent =
        `検索結果：${orders.length}件`;


    if(orders.length === 0){

        savedOrders.innerHTML = `

            <div class="no-result">

                該当する注文がありません。

            </div>

        `;

        return;
    }


    orders.forEach(
        order => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "order-card";


            let photosHTML = "";

            if(
                order.photos &&
                order.photos.length > 0
            ){

                photosHTML = `

                    <div class="saved-photos">

                        ${
                            order.photos
                            .map(
                                photo =>
                                `<img
                                    src="${photo}"
                                    alt="注文写真"
                                >`
                            )
                            .join("")
                        }

                    </div>

                `;

            }


            let signatureHTML = "";

            if(order.signature){

                signatureHTML = `

                    <div class="saved-signature">

                        <div class="saved-signature-title">
                            🔒 お客様署名
                        </div>

                        <img
                            src="${order.signature}"
                            alt="お客様署名"
                        >

                    </div>

                `;

            }


            let noticesHTML = "";

            if(
                order.noticesAgreed &&
                order.noticeTexts &&
                order.noticeTexts.length
            ){

                noticesHTML = `

                    <div class="saved-notices">

                        <strong>
                            🔒 注意事項確認済み
                        </strong>

                        <br>

                        ${order.noticeTexts.length}項目

                    </div>

                `;

            }


            card.innerHTML = `

                <div class="order-number">

                    注文番号：
                    ${escapeHTML(
                        order.orderNumber
                    )}

                </div>


                <div class="order-info">

                    <div class="order-product">

                        ${escapeHTML(
                            order.product
                        )}

                    </div>

                    <br>

                    <strong>
                        お客様名・会社名：
                    </strong>

                    ${escapeHTML(
                        order.customerName
                    )}

                    <br>

                    <strong>
                        受付日：
                    </strong>

                    ${escapeHTML(
                        order.delivery
                    )}

                    ${
                        order.notes
                        ?
                        `<br>
                        <strong>
                            備考：
                        </strong>
                        ${escapeHTML(
                            order.notes
                        )}`
                        :
                        ""
                    }

                </div>


                ${photosHTML}

                ${signatureHTML}

                ${noticesHTML}


                <div class="order-buttons">

                    <button
                        type="button"
                        class="edit-btn">
                        ✏️ 編集
                    </button>

                    <button
                        type="button"
                        class="delete-btn">
                        🗑 削除
                    </button>

                </div>

            `;


            card
            .querySelector(".edit-btn")
            .addEventListener(
                "click",
                function(){

                    openEditModal(
                        order
                    );

                }
            );


            card
            .querySelector(".delete-btn")
            .addEventListener(
                "click",
                function(){

                    deleteOrder(
                        order
                    );

                }
            );


            savedOrders.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   編集モーダル
===================================================== */

const editModal =
    document.getElementById(
        "editModal"
    );

const editCustomerName =
    document.getElementById(
        "editCustomerName"
    );

const editDelivery =
    document.getElementById(
        "editDelivery"
    );

const editNotes =
    document.getElementById(
        "editNotes"
    );

const editOrderNumber =
    document.getElementById(
        "editOrderNumber"
    );

const editProductGrid =
    document.getElementById(
        "editProductGrid"
    );

const editPhotoPreview =
    document.getElementById(
        "editPhotoPreview"
    );

const editSignaturePreview =
    document.getElementById(
        "editSignaturePreview"
    );

const editNoticePreview =
    document.getElementById(
        "editNoticePreview"
    );


/* 商品ボタンを編集画面に作る */

function createEditProductButtons(){

    editProductGrid.innerHTML = "";

    products.forEach(
        (product,index)=>{

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                `product-btn product-${index+1}`;

            button.textContent =
                product;

            button.dataset.product =
                product;


            button.addEventListener(
                "click",
                function(){

                    editSelectedProduct =
                        product;

                    editProductGrid
                    .querySelectorAll(
                        ".product-btn"
                    )
                    .forEach(
                        btn =>
                            btn.classList
                            .remove(
                                "selected"
                            )
                    );

                    button.classList.add(
                        "selected"
                    );

                }
            );


            editProductGrid.appendChild(
                button
            );

        }
    );

}

createEditProductButtons();


/* =====================================================
   編集を開く
===================================================== */

function openEditModal(order){

    editingOrderKey = {
        orderNumber:
            order.orderNumber,

        createdAt:
            order.createdAt
    };


    editOrderNumber.value =
        order.orderNumber;


    editCustomerName.value =
        order.customerName || "";


    editDelivery.value =
        order.delivery || "";


    editNotes.value =
        order.notes || "";


    editSelectedProduct =
        order.product;


    editSelectedPhotos =
        order.photos
        ? order.photos.slice()
        : [];


    editProductGrid
    .querySelectorAll(
        ".product-btn"
    )
    .forEach(
        button => {

            button.classList.toggle(
                "selected",
                button.dataset.product ===
                order.product
            );

        }
    );


    renderEditPhotos();


    if(order.signature){

        editSignaturePreview.src =
            order.signature;

        editSignaturePreview.style.display =
            "block";

    }else{

        editSignaturePreview.removeAttribute(
            "src"
        );

    }


    renderEditNotices(
        order
    );


    editModal.style.display =
        "block";

    document.body.style.overflow =
        "hidden";

}


/* =====================================================
   編集写真表示
===================================================== */

function renderEditPhotos(){

    editPhotoPreview.innerHTML = "";

    editSelectedPhotos.forEach(
        (photo,index)=>{

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "photo-preview-item";

            item.innerHTML = `

                <img
                    src="${photo}"
                    alt="写真${index+1}"
                >

                <button
                    type="button"
                    class="photo-remove">
                    ×
                </button>

            `;


            item
            .querySelector(
                ".photo-remove"
            )
            .addEventListener(
                "click",
                function(){

                    editSelectedPhotos
                    .splice(
                        index,
                        1
                    );

                    renderEditPhotos();

                }
            );


            editPhotoPreview
            .appendChild(
                item
            );

        }
    );

}


/* =====================================================
   編集注意事項
===================================================== */

function renderEditNotices(order){

    editNoticePreview.innerHTML = "";

    const current =
        order.noticeTexts || [];


    if(current.length === 0){

        editNoticePreview.innerHTML =
            "この注文には注意事項はありません。";

        return;
    }


    current.forEach(
        (text,index)=>{

            const div =
                document.createElement(
                    "div"
                );

            div.style.marginTop =
                "8px";

            div.innerHTML = `

                ☑
                ${escapeHTML(text)}

            `;

            editNoticePreview
            .appendChild(
                div
            );

        }
    );

}


/* =====================================================
   編集写真入力
===================================================== */

const editCameraButton =
    document.getElementById(
        "editCameraButton"
    );

const editPhotoButton =
    document.getElementById(
        "editPhotoButton"
    );

const editCameraInput =
    document.getElementById(
        "editCameraInput"
    );

const editPhotoInput =
    document.getElementById(
        "editPhotoInput"
    );


editCameraButton.addEventListener(
    "click",
    ()=>{
        editCameraInput.click();
    }
);


editPhotoButton.addEventListener(
    "click",
    ()=>{
        editPhotoInput.click();
    }
);


editCameraInput.addEventListener(
    "change",
    function(){

        handleEditPhotos(
            this.files
        );

        this.value = "";

    }
);


editPhotoInput.addEventListener(
    "change",
    function(){

        handleEditPhotos(
            this.files
        );

        this.value = "";

    }
);


function handleEditPhotos(files){

    const fileArray =
        Array.from(files);


    if(
        editSelectedPhotos.length +
        fileArray.length > 3
    ){

        alert(
            "写真は最大3枚まで保存できます。"
        );

        return;
    }


    fileArray.forEach(
        file => {

            compressImage(file)
            .then(
                dataURL => {

                    editSelectedPhotos
                    .push(dataURL);

                    renderEditPhotos();

                }
            );

        }
    );

}


/* =====================================================
   編集を保存
===================================================== */

document
.getElementById(
    "editSaveButton"
)
.addEventListener(
    "click",
    saveEditedOrder
);


function saveEditedOrder(){

    if(!editingOrderKey){

        return;

    }


    if(
        !editCustomerName.value.trim()
    ){

        alert(
            "お客様名または会社名を入力してください。"
        );

        return;
    }


    if(!editSelectedProduct){

        alert(
            "商品カテゴリーを選択してください。"
        );

        return;
    }


    if(!editDelivery.value){

        alert(
            "受付日を入力してください。"
        );

        return;
    }


    const orders =
        getOrders();


    const targetIndex =
        orders.findIndex(
            order =>
                order.orderNumber ===
                editingOrderKey.orderNumber
                &&
                order.createdAt ===
                editingOrderKey.createdAt
        );


    if(targetIndex === -1){

        alert(
            "編集する注文が見つかりません。"
        );

        closeEditModal();

        return;
    }


    /*
       ここが重要です。

       customerName
       product
       delivery
       photos
       notes

       だけ変更。

       signature
       noticesAgreed
       noticeTexts
       orderNumber
       createdAt

       は変更しません。
    */


    orders[targetIndex].customerName =
        editCustomerName.value.trim();

    orders[targetIndex].product =
        editSelectedProduct;

    orders[targetIndex].delivery =
        editDelivery.value;

    orders[targetIndex].photos =
        editSelectedPhotos.slice();

    orders[targetIndex].notes =
        editNotes.value.trim();


    try{

        saveOrders(orders);

    }catch(e){

        alert(
            "保存容量を超えた可能性があります。\n写真を減らして再度お試しください。"
        );

        return;

    }


    alert(
        "注文情報を変更しました。"
    );


    closeEditModal();


    /*
       検索条件があれば
       その条件を維持して再表示
    */

    searchOrders();

}


/* =====================================================
   編集キャンセル
===================================================== */

document
.getElementById(
    "editCancelButton"
)
.addEventListener(
    "click",
    closeEditModal
);


function closeEditModal(){

    editModal.style.display =
        "none";

    document.body.style.overflow =
        "";

    editingOrderKey =
        null;

}


/* =====================================================
   削除
===================================================== */

function deleteOrder(
    targetOrder
){

    const answer =
        confirm(
            "この注文を削除しますか？\n\n" +
            "注文番号：" +
            targetOrder.orderNumber
        );


    if(!answer){

        return;

    }


    const orders =
        getOrders();


    const filtered =
        orders.filter(
            order =>
                !(
                    order.orderNumber ===
                    targetOrder.orderNumber
                    &&
                    order.createdAt ===
                    targetOrder.createdAt
                )
        );


    saveOrders(
        filtered
    );


    searchOrders();

}
