<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>注文受付アプリ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f5f6f8;color:#222}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:900px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #00000012}
h1,h2{margin-top:0}
.form-group{margin-bottom:24px}
label{font-weight:700;display:block;margin-bottom:7px}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;background:#fff}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:11px;padding:12px 16px;font-weight:700}
.btn-primary{background:#111;color:#fff}
.btn-secondary{background:#e9ebef;color:#222}
.btn-danger{background:#d33;color:#fff}
.btn-small{padding:8px 11px;font-size:14px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.product{border:2px solid #ddd;background:#fff;text-align:left}
.product.selected{box-shadow:0 0 0 3px #00000014}
.product-1{border-color:#e53935}.product-1.selected{background:#ffebeb}
.product-2{border-color:#1976d2}.product-2.selected{background:#eaf3ff}
.product-3{border-color:#26a6d1}.product-3.selected{background:#e8f9ff}
.product-4{border-color:#9dbd31}.product-4.selected{background:#f5fadf}
.product-5{border-color:#39a852}.product-5.selected{background:#eaf8ee}
.product-6{border-color:#777}.product-6.selected{background:#f1f1f1}
.product-7{border-color:#ed8b22}.product-7.selected{background:#fff3e5}
.product-8{border-color:#b4865b}.product-8.selected{background:#f8eee4}
.product-9{border-color:#7b45b8}.product-9.selected{background:#f4eaff}
.product-10{border-color:#df6c9b}.product-10.selected{background:#ffedf4}
.product-11{border-color:#aaa}.product-11.selected{background:#fafafa}
.notice{border:1px solid #ddd;border-radius:12px;padding:13px;margin-bottom:10px;background:#fafafa}
.notice label{font-weight:500;display:flex;gap:10px;align-items:flex-start}
.notice input{width:22px;height:22px;flex:none}
.warning-text{color:#d00;font-weight:700;margin:8px 0 0 32px}
#signatureCanvas{width:100%;height:220px;border:2px solid #333;border-radius:12px;background:#fff;touch-action:none}
.photo-list,.saved-photos{display:flex;gap:10px;flex-wrap:wrap}
.photo-box{position:relative;width:140px}
.photo-box img{width:140px;height:105px;object-fit:cover;border-radius:10px;border:1px solid #ddd}
.photo-box button{position:absolute;right:3px;top:3px;border-radius:50%;width:30px;height:30px;padding:0;background:#d33;color:#fff}
.saved{border:1px solid #ddd;border-radius:15px;padding:15px;margin-top:12px}
.saved-header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meta,.small{color:#666;font-size:13px}
.saved-photos img{width:110px;height:85px;object-fit:cover;border-radius:8px}
.saved-sign{max-width:500px;width:100%;border:1px solid #ddd;border-radius:8px;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.search-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.locked{padding:13px;border:1px dashed #aaa;border-radius:10px;background:#f6f6f6}
.modal{position:fixed;inset:0;background:#0008;z-index:20;overflow:auto}
.hidden{display:none!important}
#loginPanel{max-width:520px;margin:7vh auto;padding:20px}
#loginPanel input{margin-bottom:14px}
#sessionBar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#loginMessage{color:#b00020;white-space:pre-wrap}
.store-pill{background:#e9ebef;padding:8px 12px;border-radius:20px;font-weight:700}
.pdf-only{display:none}
@media(max-width:650px){.products,.search-grid{grid-template-columns:1fr}.wrap{padding:9px}.card{padding:15px}}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .print-page{width:100%;padding:18mm;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#111}
  .print-title{font-size:22px;font-weight:700;margin-bottom:18px}
  .print-table{width:100%;border-collapse:collapse;margin-bottom:18px}
  .print-table th,.print-table td{border:1px solid #999;padding:8px;text-align:left;vertical-align:top}
  .print-table th{width:25%;background:#f2f2f2}
  .print-section{font-size:16px;font-weight:700;border-bottom:2px solid #222;padding-bottom:5px;margin:18px 0 8px}
  .print-photo{width:48%;max-width:75mm;max-height:55mm;object-fit:contain;border:1px solid #ccc;margin:3mm}
  .print-sign{max-width:90mm;max-height:45mm;border:1px solid #ccc}
  .print-notice{margin:5px 0;line-height:1.6}
  .print-check{font-weight:700}
}
</style>
</head>
<body>
<div id="passwordResetPanel" class="card wrap hidden">
  <h1>新しいパスワードの設定</h1>
  <p>店舗ログイン用の新しいパスワードを入力してください。</p>
  <label for="newPassword">新しいパスワード</label>
  <input id="newPassword" type="password" autocomplete="new-password" placeholder="新しいパスワード（8文字以上推奨）">
  <label for="confirmPassword">新しいパスワード（確認）</label>
  <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="同じパスワードをもう一度入力">
  <button id="savePasswordBtn" class="btn-primary" style="width:100%">新しいパスワードを保存</button>
  <p id="passwordResetMessage" class="small" role="status"></p>
</div>
<div id="loginPanel" class="card wrap">
  <h1>注文受付アプリ ログイン</h1>
  <p>店舗ごとのメールアドレスとパスワードでログインしてください。</p>
  <label for="loginEmail">メールアドレス</label>
  <input id="loginEmail" type="email" autocomplete="username" placeholder="店舗のメールアドレス">
  <label for="loginPassword">パスワード</label>
  <input id="loginPassword" type="password" autocomplete="current-password" placeholder="パスワード">
  <button id="loginBtn" class="btn-primary" style="width:100%">ログイン</button>
  <p id="loginMessage" class="small"></p>
</div>
<div id="sessionBar" class="wrap hidden">
  <span class="store-pill" id="currentStoreLabel"></span>
  <button id="logoutBtn" class="btn-secondary">ログアウト</button>
</div>
<div id="app" class="wrap hidden">
  <div class="card">
    <h1>注文受付</h1>
    <div class="form-group">
      <label>お客様名または会社名</label>
      <input id="customerName">
    </div>

    <div class="form-group">
      <label>商品</label>
      <div id="products" class="products"></div>
    </div>

    <div class="form-group">
      <label>受付日</label>
      <input id="delivery" type="date">
    </div>

    <div class="form-group">
      <label>お客様からのお預かり品・資料の写真（最大3枚）</label>
      <div class="actions">
        <button id="cameraBtn" class="btn-secondary">📷 カメラで撮影</button>
        <button id="photoBtn" class="btn-secondary">🖼 写真から選ぶ</button>
      </div>
      <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
      <input id="photoInput" type="file" accept="image/*" multiple hidden>
      <div id="photoPreview" class="photo-list"></div>
    </div>

    <div class="form-group">
      <label>備考</label>
      <textarea id="notes"></textarea>
    </div>

    <div id="noticeArea" class="form-group hidden">
      <h2>注意事項</h2>
      <div id="noticeList"></div>
    </div>

    <div class="form-group">
      <label>お客様署名</label>
      <canvas id="signatureCanvas"></canvas>
      <div class="actions">
        <button id="clearSignatureBtn" class="btn-secondary">署名を消す</button>
      </div>
    </div>

    <button id="saveBtn" class="btn-primary" style="width:100%">注文を保存</button>
  </div>

  <div class="card">
    <h2>保存済み注文</h2>
    <div class="search-grid">
      <div>
        <label>受付日</label>
        <input id="searchDate" type="date">
      </div>
      <div>
        <label>お客様名</label>
        <input id="searchName" placeholder="一部でも検索できます">
      </div>
      <div>
        <label>商品</label>
        <select id="searchProduct"><option value="">すべて</option></select>
      </div>
    </div>
    <div class="actions">
      <button id="searchButton" class="btn-primary">検索</button>
      <button id="refreshButton" class="btn-secondary">最新データを再読込</button>
      <button id="resetSearchButton" class="btn-secondary">条件をクリア</button>
    </div>
    <p id="searchResultCount" class="small"></p>
    <div id="savedOrders"></div>
  </div>
</div>

<div id="editModal" class="modal hidden">
  <div class="wrap">
    <div class="card">
      <h2>注文情報を編集</h2>
      <div class="form-group">
        <label>注文番号</label>
        <div id="editOrderNumber" class="locked"></div>
      </div>
      <div class="form-group">
        <label>商品（変更不可）</label>
        <div id="editProduct" class="locked"></div>
      </div>
      <div class="form-group">
        <label>お客様名または会社名</label>
        <input id="editCustomerName">
      </div>
      <div class="form-group">
        <label>受付日</label>
        <input id="editDelivery" type="date">
      </div>
      <div class="form-group">
        <label>写真（追加・削除可能／最大3枚）</label>
        <div class="actions">
          <button id="editCameraBtn" class="btn-secondary">📷 カメラ</button>
          <button id="editPhotoBtn" class="btn-secondary">🖼 写真</button>
        </div>
        <input id="editCameraInput" type="file" accept="image/*" capture="environment" hidden>
        <input id="editPhotoInput" type="file" accept="image/*" multiple hidden>
        <div id="editPhotoPreview" class="photo-list"></div>
      </div>
      <div class="form-group">
        <label>備考</label>
        <textarea id="editNotes"></textarea>
      </div>
      <div class="form-group">
        <label>注意事項（変更不可）</label>
        <div id="editNotices" class="locked"></div>
      </div>
      <div class="form-group">
        <label>署名（変更不可）</label>
        <img id="editSignature" class="saved-sign">
      </div>
      <div class="actions">
        <button id="editSaveBtn" class="btn-primary">変更を保存</button>
        <button id="editCancelBtn" class="btn-secondary">キャンセル</button>
      </div>
    </div>
  </div>
</div>

<div id="printArea" class="pdf-only"></div>

function showApp(){
 $("loginPanel").classList.add("hidden");$("app").classList.remove("hidden");$("sessionBar").classList.remove("hidden");
 $("currentStoreLabel").textContent=`ログイン中：${currentStoreName}`;
}
async function login(){
 const email=$("loginEmail").value.trim(),password=$("loginPassword").value;
 if(!email||!password){$("loginMessage").textContent="メールアドレスとパスワードを入力してください。";return;}
 $("loginBtn").disabled=true;$("loginMessage").textContent="ログイン中…";
 try{
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error)throw error;
  currentUser=data.user;
  const {data:profile,error:profileError}=await db.from("store_profiles").select("store_name").eq("user_id",currentUser.id).single();
  if(profileError)throw new Error("店舗設定を取得できません。Supabaseのstore_profilesにユーザーIDと店舗名が登録されているか確認してください。\n"+profileError.message);
  currentStoreName=profile.store_name;
  await loadOrders();showApp();searchOrders();
 }catch(e){
  await db.auth.signOut();currentUser=null;currentStoreName="";
  showLogin("ログインできませんでした。メールアドレス・パスワード、Supabaseの設定を確認してください。\n"+(e.message||e));
 }finally{$("loginBtn").disabled=false;}
}
async function logout(){await db.auth.signOut();currentUser=null;currentStoreName="";ordersCache=[];showLogin("ログアウトしました。");}
async function refreshOrders(){await loadOrders();searchOrders();}

function renderProducts(){
 $("products").innerHTML=PRODUCTS.map((p,i)=>`
 <button type="button" class="product product-${i+1} ${selectedProduct===p?"selected":""}" data-p="${esc(p)}">${esc(p)}</button>`).join("");
 document.querySelectorAll("#products .product").forEach(b=>b.onclick=()=>{
  selectedProduct=b.dataset.p;renderProducts();renderNotices();
 });
}
function renderSearchProducts(){
 $("searchProduct").innerHTML='<option value="">すべて</option>'+PRODUCTS.map(p=>`<option>${esc(p)}</option>`).join("");
}
function renderNotices(){
 const arr=NOTICES[selectedProduct]||[];
 $("noticeArea").classList.toggle("hidden",!arr.length);
 $("noticeList").innerHTML=arr.map((t,i)=>{
  const warn=(selectedProduct==="② 印鑑"||selectedProduct==="③ スタンプ・ゴム印")&&i===1;
  return `<div class="notice">
   <label><input type="checkbox" class="noticeCheck"><span>${esc(t)}</span></label>
   ${warn?'<div class="warning-text">最後のデータチェックはお時間をしっかり取って頂き、校正内容に間違いがないか念入りにお確かめください。</div>':""}
  </div>`;
 }).join("");
}

function resizeCanvas(){
 const c=$("signatureCanvas"),r=c.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);
 c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
 const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.lineWidth=2.5;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#111";
}
function setupSignature(){
 const c=$("signatureCanvas");resizeCanvas();
 let drawing=false,last=null;
 const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
 c.onpointerdown=e=>{e.preventDefault();drawing=true;last=pos(e);signatureDirty=true;c.setPointerCapture?.(e.pointerId)};
 c.onpointermove=e=>{if(!drawing)return;e.preventDefault();const p=pos(e),x=c.getContext("2d");x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p};
 c.onpointerup=c.onpointercancel=()=>{drawing=false;last=null};
 $("clearSignatureBtn").onclick=()=>{resizeCanvas();signatureDirty=false};
}
function hasSignature(){
 if(!signatureDirty)return false;
 const c=$("signatureCanvas"),p=c.getContext("2d").getImageData(0,0,c.width,c.height).data;
 for(let i=3;i<p.length;i+=4)if(p[i]>0)return true;
 return false;
}
function compressImage(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const max=1200,s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
    resolve(c.toDataURL("image/jpeg",.75));
   };
   img.onerror=reject;img.src=r.result;
  };
  r.onerror=reject;r.readAsDataURL(file);
 });
}
async function addFiles(files,target){
 for(const f of Array.from(files)){
  if(target.length>=3){alert("写真は最大3枚までです。");break;}
  if(f.type.startsWith("image/"))target.push(await compressImage(f));
 }
 target===photos?renderPhotoPreview():renderEditPhotoPreview();
}
function renderPhotoPreview(){
 $("photoPreview").innerHTML=photos.map((p,i)=>`<div class="photo-box"><img src="${p}"><button data-i="${i}">×</button></div>`).join("");
 $("photoPreview").querySelectorAll("button").forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.i,1);renderPhotoPreview()});
}
function renderEditPhotoPreview(){
 $("editPhotoPreview").innerHTML=editPhotos.map((p,i)=>`<div class="photo-box"><img src="${p}"><button data-i="${i}">×</button></div>`).join("");
 $("editPhotoPreview").querySelectorAll("button").forEach(b=>b.onclick=()=>{editPhotos.splice(+b.dataset.i,1);renderEditPhotoPreview()});
}

function nextOrderNumber(date){
 const ymd=date.replaceAll("-","");
 const same=getOrders().filter(o=>o.receptionDate===date);
 return `${ymd}-${String(same.length+1).padStart(3,"0")}`;
}
async function saveOrder(){
 const name=$("customerName").value.trim(),date=$("delivery").value;
 if(!name)return alert("お客様名または会社名を入力してください。");
 if(!selectedProduct)return alert("商品を選択してください。");
 if(!date)return alert("受付日を入力してください。");
 if(!hasSignature())return alert("お客様の署名を入力してください。");
 const notices=NOTICES[selectedProduct]||[];
 if(notices.length&&[...document.querySelectorAll(".noticeCheck")].some(x=>!x.checked))
  return alert("注意事項をすべて確認・チェックしてください。");

 const order={
  orderNumber:nextOrderNumber(date),customerName:name,product:selectedProduct,
  receptionDate:date,photos:photos.slice(),notes:$("notes").value,
  signature:$("signatureCanvas").toDataURL("image/png"),
  noticeTexts:notices.slice(),noticesAgreed:!!notices.length,
  createdAt:new Date().toISOString()
 };
 const payload={order_number:order.orderNumber,store_name:currentStoreName,customer_name:order.customerName,product:order.product,reception_date:order.receptionDate,photos:order.photos,notes:order.notes,signature_data:order.signature,notice_texts:order.noticeTexts,notices_agreed:order.noticesAgreed};
 const {data,error}=await db.from("orders").insert(payload).select("*").single();
 if(error){alert("保存できませんでした。\n"+error.message);return;}
 ordersCache.unshift(mapDbOrder(data));
 alert(`保存しました。\n注文番号：${order.orderNumber}\n保存店舗：${currentStoreName}`);
 resetForm();searchOrders();
}
function resetForm(){
 $("customerName").value="";$("delivery").value=today();$("notes").value="";
 selectedProduct="";photos=[];renderProducts();renderPhotoPreview();renderNotices();resizeCanvas();signatureDirty=false;
}
function searchOrders(){
 const d=$("searchDate").value,n=$("searchName").value.trim().toLowerCase(),p=$("searchProduct").value;
 const orders=getOrders().filter(o=>
  (!d||o.receptionDate===d)&&(!n||String(o.customerName).toLowerCase().includes(n))&&(!p||o.product===p)
 ).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
 $("searchResultCount").textContent=`${orders.length}件`;
 renderSavedOrders(orders);
}
function key(o){return `${o.orderNumber}__${o.createdAt}`}
function renderSavedOrders(orders){
 if(!orders.length){$("savedOrders").innerHTML="<p class='small'>該当する注文はありません。</p>";return}
 $("savedOrders").innerHTML=orders.map(o=>`
 <div class="saved">
  <div class="saved-header">
   <div><strong>${esc(o.orderNumber)}</strong><div class="meta">${esc(o.product)} / 受付日 ${esc(o.receptionDate)} / 保存店舗 ${esc(o.storeName||"")}</div></div>
   <strong>${esc(o.customerName)}</strong>
  </div>
  ${o.notes?`<p><strong>備考：</strong>${esc(o.notes)}</p>`:""}
  ${(o.photos||[]).length?`<div class="saved-photos">${o.photos.map(p=>`<img src="${p}">`).join("")}</div>`:""}
  ${o.signature?`<div><div class="small">署名</div><img class="saved-sign" src="${o.signature}"></div>`:""}
  <div class="actions">
   <button class="btn-secondary btn-small editBtn" data-key="${esc(key(o))}">編集</button>
   <button class="btn-secondary btn-small pdfBtn" data-key="${esc(key(o))}">PDF保存</button>
   <button class="btn-danger btn-small deleteBtn" data-key="${esc(key(o))}">削除</button>
  </div>
 </div>`).join("");
 document.querySelectorAll(".editBtn").forEach(b=>b.onclick=()=>openEdit(b.dataset.key,orders));
 document.querySelectorAll(".pdfBtn").forEach(b=>b.onclick=()=>savePDF(b.dataset.key));
 document.querySelectorAll(".deleteBtn").forEach(b=>b.onclick=()=>deleteOrder(b.dataset.key));
}

async function deleteOrder(k){
 const o=getOrders().find(x=>key(x)===k);if(!o)return;
 if(!confirm(`${o.orderNumber}を削除しますか？\nこの注文は全店舗の画面から削除されます。`))return;
 const {error}=await db.from("orders").delete().eq("id",o.id);
 if(error){alert("削除できませんでした。\n"+error.message);return;}
 ordersCache=ordersCache.filter(x=>x.id!==o.id);searchOrders();
}

function openEdit(k){
 const o=getOrders().find(x=>key(x)===k);if(!o)return;
 editingOrder=o;
 $("editOrderNumber").textContent=o.orderNumber;$("editProduct").textContent=o.product;
 $("editCustomerName").value=o.customerName;$("editDelivery").value=o.receptionDate;$("editNotes").value=o.notes||"";
 $("editSignature").src=o.signature||"";
 $("editNotices").innerHTML=(o.noticeTexts||[]).length?`<ol>${o.noticeTexts.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>`:"この注文には注意事項はありません。";
 editPhotos=(o.photos||[]).slice();renderEditPhotoPreview();$("editModal").classList.remove("hidden");
}
async function saveEdit(){
 if(!editingOrder)return;
 const customerName=$("editCustomerName").value.trim(),receptionDate=$("editDelivery").value;
 if(!customerName){alert("お客様名または会社名を入力してください。");return;}
 if(!receptionDate){alert("受付日を入力してください。");return;}
 const patch={customer_name:customerName,reception_date:receptionDate,photos:editPhotos.slice(),notes:$("editNotes").value};
 const {data,error}=await db.from("orders").update(patch).eq("id",editingOrder.id).select("*").single();
 if(error){alert("変更を保存できませんでした。\n"+error.message);return;}
 const updated=mapDbOrder(data);ordersCache=ordersCache.map(o=>o.id===updated.id?updated:o);
 $("editModal").classList.add("hidden");editingOrder=null;searchOrders();
}
function savePDF(k){
 const o=getOrders().find(x=>key(x)===k);if(!o)return;
 const notices=o.noticeTexts||[];
 const photosHtml=(o.photos||[]).map((p,i)=>`<img class="print-photo" src="${p}" alt="資料写真${i+1}">`).join("");
 $("printArea").innerHTML=`
 <div class="print-page">
  <div class="print-title">注文受付書</div>
  <table class="print-table">
   <tr><th>注文番号</th><td>${esc(o.orderNumber)}</td></tr>
   <tr><th>お客様名または会社名</th><td>${esc(o.customerName)}</td></tr>
   <tr><th>商品</th><td>${esc(o.product)}</td></tr>
   <tr><th>受付日</th><td>${esc(o.receptionDate)}</td></tr>
  </table>
  <div class="print-section">備考</div>
  <div>${o.notes?esc(o.notes).replace(/\n/g,"<br>"):"なし"}</div>
  ${photosHtml?`<div class="print-section">お客様からのお預かり品・資料</div><div>${photosHtml}</div>`:""}
  ${notices.length?`<div class="print-section">注意事項</div>${notices.map(t=>`<div class="print-notice"><span class="print-check">☑</span> ${esc(t)}</div>`).join("")}`:""}
  ${o.signature?`<div class="print-section">お客様署名</div><img class="print-sign" src="${o.signature}">`:""}
 </div>`;
 setTimeout(()=>window.print(),100);
}

$("cameraBtn").onclick=()=>$("cameraInput").click();
$("photoBtn").onclick=()=>$("photoInput").click();
$("cameraInput").onchange=e=>addFiles(e.target.files,photos);
$("photoInput").onchange=e=>addFiles(e.target.files,photos);
$("saveBtn").onclick=saveOrder;
$("searchButton").onclick=searchOrders;
$("refreshButton").onclick=async()=>{try{await refreshOrders();}catch(e){alert("再読込できませんでした。\n"+e.message)}};
$("searchDate").onchange=searchOrders;
$("searchProduct").onchange=searchOrders;
$("searchName").oninput=()=>{clearTimeout(window.__t);window.__t=setTimeout(searchOrders,250)};
$("resetSearchButton").onclick=()=>{$("searchDate").value="";$("searchName").value="";$("searchProduct").value="";searchOrders()};
$("editCameraBtn").onclick=()=>$("editCameraInput").click();
$("editPhotoBtn").onclick=()=>$("editPhotoInput").click();
$("editCameraInput").onchange=e=>addFiles(e.target.files,editPhotos);
$("editPhotoInput").onchange=e=>addFiles(e.target.files,editPhotos);
$("editSaveBtn").onclick=saveEdit;
$("editCancelBtn").onclick=()=>{$("editModal").classList.add("hidden");editingOrder=null};

async function saveNewPassword(){
 const password=$("newPassword").value,confirm=$("confirmPassword").value;
 const msg=$("passwordResetMessage");
 if(password.length<8){msg.textContent="パスワードは8文字以上で入力してください。";return;}
 if(password!==confirm){msg.textContent="2つのパスワードが一致しません。もう一度確認してください。";return;}
 $("savePasswordBtn").disabled=true;msg.textContent="パスワードを保存しています…";
 try{
  const {data,error}=await db.auth.updateUser({password});
  if(error)throw error;
  isPasswordRecovery=false;
  $("newPassword").value="";$("confirmPassword").value="";
  await db.auth.signOut();
  showLogin("パスワードを変更しました。本町店のメールアドレスと新しいパスワードでログインしてください。");
 }catch(e){
  msg.textContent="変更できませんでした。再設定メールのリンクが期限切れの可能性があります。もう一度メールを送ってください。\n"+(e.message||e);
 }finally{$("savePasswordBtn").disabled=false;}
}
$("savePasswordBtn").onclick=saveNewPassword;
$("loginBtn").onclick=login;
$("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("loginEmail").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("logoutBtn").onclick=logout;
$("delivery").value=today();
renderProducts();renderSearchProducts();renderNotices();setupSignature();
showLogin();
db.auth.onAuthStateChange((event, session)=>{
 if(event==="PASSWORD_RECOVERY"){showPasswordReset("本町店の新しいパスワードを設定してください。");}
});
db.auth.getSession().then(async ({data,error})=>{
 if(error||!data.session)return;
 if(isPasswordRecovery || new URLSearchParams(window.location.hash.replace(/^#/,"")).get("type")==="recovery") {showPasswordReset("新しいパスワードを設定してください。");return;}
 currentUser=data.session.user;
 const {data:profile,error:profileError}=await db.from("store_profiles").select("store_name").eq("user_id",currentUser.id).single();
 if(profileError){showLogin("店舗設定を取得できません。\n"+profileError.message);return;}
 currentStoreName=profile.store_name;
 try{await loadOrders();showApp();searchOrders();}catch(e){showLogin("注文データを読み込めませんでした。\n"+(e.message||e));}
});
</script>
