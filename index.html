<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>注文署名</title>


<style>

/* =========================
   基本設定
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 20px;

    background: #f2f3f5;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        YuGothic,
        sans-serif;

    color: #222;
}

.container {
    max-width: 1100px;
    margin: auto;
}


/* =========================
   タイトル
========================= */

h1 {
    text-align: center;
    font-size: 32px;
    margin: 10px 0 25px;
}


/* =========================
   カード
========================= */

.card {
    background: white;

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 20px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}


/* =========================
   入力欄
========================= */

label {
    display: block;

    font-size: 19px;

    font-weight: bold;

    margin-bottom: 8px;
}

input,
select,
textarea {

    width: 100%;

    font-size: 19px;

    padding: 14px;

    border: 1px solid #ccc;

    border-radius: 10px;

    background: white;

    margin-bottom: 20px;
}

input,
select {
    height: 55px;
}

textarea {

    min-height: 120px;

    resize: vertical;
}


/* =========================
   その他の商品
========================= */

#otherProductArea {
    display: none;
}


/* =========================
   商品別注意事項
========================= */

#noticeArea {
    display: none;

    margin-top: 20px;
    margin-bottom: 25px;
}

.notice-title {

    font-size: 24px;

    font-weight: bold;

    margin-bottom: 15px;
}

.notice-description {

    font-size: 16px;

    line-height: 1.6;

    margin-bottom: 15px;
}


/* 注意事項 */

.notice-item {

    display: flex;

    align-items: flex-start;

    gap: 12px;

    padding: 15px 12px;

    margin-bottom: 10px;

    background: #f7f7f7;

    border: 1px solid #ddd;

    border-radius: 10px;

    cursor: pointer;

    user-select: none;
}


/* チェック部分 */

.notice-checkbox {

    flex-shrink: 0;

    width: 30px;

    height: 30px;

    border: 2px solid #777;

    border-radius: 5px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 21px;

    font-weight: bold;
}

.notice-checkbox.checked {

    background: #222;

    color: white;

    border-color: #222;
}


/* 注意事項文章 */

.notice-text {

    flex: 1;

    font-size: 16px;

    line-height: 1.65;
}


/* 赤文字 */

.notice-red {

    color: #d00000;

    font-weight: bold;

    margin-top: 8px;
}


/* 注意事項不足 */

.notice-warning {

    display: none;

    margin-top: 15px;

    padding: 14px;

    border-radius: 10px;

    background: #fff3f3;

    border: 1px solid #e0aaaa;

    color: #a00000;

    font-size: 16px;

    font-weight: bold;
}

.notice-warning.show {
    display: block;
}


/* =========================
   写真
========================= */

.photo-buttons {

    display: flex;

    gap: 12px;

    flex-wrap: wrap;

    margin-bottom: 15px;
}

.photo-button {

    flex: 1;

    min-width: 220px;

    min-height: 58px;

    border: none;

    border-radius: 12px;

    background: #eeeeee;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}

.photo-button:active {
    transform: scale(0.98);
}


/* 写真プレビュー */

.photo-preview {

    display: flex;

    gap: 12px;

    flex-wrap: wrap;
}

.photo-box {

    position: relative;

    width: 150px;

    height: 150px;
}

.photo-box img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    border-radius: 10px;

    border: 1px solid #ccc;
}

.photo-delete {

    position: absolute;

    top: -8px;

    right: -8px;

    width: 32px;

    height: 32px;

    border-radius: 50%;

    border: none;

    background: #222;

    color: white;

    font-size: 20px;

    line-height: 32px;
}


/* =========================
   署名
========================= */

.signature-area {
    width: 100%;
}

#signature {

    display: block;

    width: 100%;

    height: 250px;

    background: white;

    border: 2px solid #aaa;

    border-radius: 12px;

    touch-action: none;
}

.clear-signature {

    margin-top: 10px;

    width: 100%;

    min-height: 50px;

    border: none;

    border-radius: 10px;

    background: #eeeeee;

    font-size: 17px;
}


/* =========================
   保存ボタン
========================= */

.save-button {

    width: 100%;

    min-height: 65px;

    border: none;

    border-radius: 14px;

    background: #222;

    color: white;

    font-size: 22px;

    font-weight: bold;

    margin-top: 10px;
}

.save-button:active {
    transform: scale(0.98);
}


/* =========================
   保存済み注文
========================= */

.order-title {

    font-size: 26px;

    margin-bottom: 20px;
}

.order-card {

    border: 1px solid #ddd;

    border-radius: 14px;

    padding: 18px;

    margin-bottom: 15px;

    background: #fafafa;
}

.order-card h3 {

    margin-top: 0;

    font-size: 21px;
}

.order-info {

    font-size: 17px;

    line-height: 1.8;
}

.saved-photos {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 10px;
}

.saved-photos img {

    width: 120px;

    height: 120px;

    object-fit: cover;

    border-radius: 8px;

    border: 1px solid #ccc;
}

.saved-signature {

    width: 100%;

    max-width: 500px;

    border: 1px solid #ccc;

    border-radius: 8px;

    margin-top: 10px;
}

.delete-button {

    width: 100%;

    min-height: 48px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    background: #ddd;

    font-size: 16px;
}


/* =========================
   PC・iPad横向き
========================= */

@media (min-width: 768px) {

    body {
        padding: 30px;
    }

    .form-grid {

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 0 25px;
    }

    .full-width {
        grid-column: 1 / 3;
    }
}


/* =========================
   iPad縦向き
========================= */

@media (max-width: 767px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 27px;
    }

    .card {
        padding: 18px;
    }

    #signature {
        height: 220px;
    }

    .notice-text {
        font-size: 15px;
    }
}

</style>

</head>


<body>


<div class="container">


<h1>注文受付</h1>


<!-- =========================
     注文入力
========================= -->

<div class="card">


<div class="form-grid">


<!-- =========================

選択してください
</option>

</option>

</option>

④ 封筒
</option>

⑤ チラシ・パンフレット
</option>

<option value="ホームページ">
⑥ ホームページ
</option>

<option value="入稿データ">

</option>

⑧ 伝票
</option>

</option>

⑩ オーダーメイド決定
</option>

</div>


<!-- =========================

<div>

</div>


<!-- =========================

========================= -->

<div>

備考

</div>


<!-- =========================
     写真
========================= -->

<div class="full-width">


<label>
お客様からお預かりした資料・写真

<!-- カメラ -->

<input
    type="file"
    id="cameraInput"

<!-- 写真 -->

<input
    type="file"
    id="photoInput"
    accept="image/*"

    style="display:none"
    onchange="handlePhotos(event)">


<div class="photo-buttons">


<button
    type="button"
    class="photo-button"
    onclick="openCamera()">

📷 カメラで撮影

</button>


<button
    type="button"
    class="photo-button"
    onclick="openPhotoLibrary()">

🖼 写真から選ぶ

</button>


</div>


<div
    id="photoPreview"
    class="photo-preview">
</div>


</div>


<!-- =========================
     商品別注意事項
========================= -->

<div
    id="noticeArea"
    class="full-width">


<div class="notice-title">
注意事項
</div>


<div class="notice-description">

内容をご確認いただき、すべてご了承いただける場合は、
各項目をタップしてチェックしてください。

</div>


<!-- ここにJavaScriptで
     商品別注意事項を表示 -->

<div id="noticeList"></div>


<div
    id="noticeWarning"
    class="notice-warning">

すべての注意事項をご確認いただき、チェックを入れてください。

</div>


</div>


<!-- =========================
     署名
========================= -->

<div class="full-width">


<label>
お客様の署名
</label>


<div class="signature-area">


<canvas id="signature"></canvas>


<button
    type="button"
    class="clear-signature"
    onclick="clearSignature()">

署名を消す

</button>


</div>


</div>


</div>


<!-- =========================
     保存
========================= -->

<button
    type="button"
    class="save-button"
    onclick="saveOrder()">

注文を保存

</button>


</div>


<!-- =========================
     保存済み注文
========================= -->

<div class="card">


<div class="order-title">
保存済み注文
</div>


<div id="orders"></div>


</div>


</div>



<script>

/* =========================================================
   現在のチェック状態
========================================================= */

let noticeChecked = [];


/* =========================================================
   商品変更
========================================================= */

function checkOtherProduct() {

    const product =
        document.getElementById(
            "product"
        ).value;


    /*
       今回は「その他」がなくなったため、
       商品変更時に注意事項を表示
    */

    showProductNotices(product);

}


/* =========================================================
   商品別注意事項表示
========================================================= */

function showProductNotices(product) {

    const noticeArea =
        document.getElementById(
            "noticeArea"
        );

    const noticeList =
        document.getElementById(
            "noticeList"
        );

    const warning =
        document.getElementById(
            "noticeWarning"
        );


    /*
       一旦リセット
    */

    noticeList.innerHTML = "";

    warning.classList.remove("show");

    noticeChecked = [];


    /*
       注意事項がない商品
    */

    if (
        !noticeData[product]
    ) {

        noticeArea.style.display =
            "none";

        return;

    }


    /*
       注意事項がある商品
    */

    const notices =
        noticeData[product];


    noticeChecked =
        new Array(
            notices.length
        ).fill(false);


    noticeArea.style.display =
        "block";


    /*
       注意事項を生成
    */

    notices.forEach(
        (notice, index) => {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "notice-item";


            item.onclick =
                function() {

                    toggleNotice(index);

                };


            const checkbox =
                document.createElement(
                    "div"
                );


            checkbox.className =
                "notice-checkbox";


            checkbox.id =
                "noticeCheck-" +
                index;


            checkbox.innerHTML =
                "☐";


            const text =
                document.createElement(
                    "div"
                );


            text.className =
                "notice-text";


            text.innerHTML =
                escapeHTML(
                    notice.text
                );


            /*
               赤文字がある場合
            */

            if (
                notice.red
            ) {

                const red =
                    document.createElement(
                        "div"
                    );


                red.className =
                    "notice-red";


                red.textContent =
                    notice.red;


                text.appendChild(
                    red
                );

            }


            item.appendChild(
                checkbox
            );


            item.appendChild(
                text
            );


            noticeList.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   注意事項チェック
========================================================= */

function toggleNotice(index) {

    if (
        index < 0 ||
        index >= noticeChecked.length
    ) {

        return;

    }


    noticeChecked[index] =
        !noticeChecked[index];


    const checkbox =
        document.getElementById(
            "noticeCheck-" +
            index
        );


    if (
        noticeChecked[index]
    ) {

        checkbox.innerHTML =
            "✓";

        checkbox.classList.add(
            "checked"
        );

    } else {

        checkbox.innerHTML =
            "☐";

        checkbox.classList.remove(
            "checked"
        );

    }


    /*
       全部チェック済みなら
       警告を消す
    */

    if (
        allNoticesChecked()
    ) {

        document
            .getElementById(
                "noticeWarning"
            )
            .classList.remove(
                "show"
            );

    }

}


/* =========================================================
   全注意事項チェック確認
========================================================= */

function allNoticesChecked() {

    /*
       注意事項がない商品
    */

    if (
        noticeChecked.length === 0
    ) {

        return true;

    }


    return noticeChecked.every(
        function(value) {

            return value === true;

        }
    );

}


/* =========================================================
   写真
========================================================= */

let selectedPhotos = [];


/* カメラ */

function openCamera() {

    if (
        selectedPhotos.length >= 3
    ) {

        alert(
            "写真は最大3枚までです。"
        );

        return;

    }


    document
        .getElementById(
            "cameraInput"
        )
        .click();

}


/* 写真から選ぶ */

function openPhotoLibrary() {

    if (
        selectedPhotos.length >= 3
    ) {

        alert(
            "写真は最大3枚までです。"
        );

        return;

    }


    document
        .getElementById(
            "photoInput"
        )
        .click();

}


/* 写真読み込み */

function handlePhotos(event) {

    const files =
        Array.from(
            event.target.files
        );


    if (
        selectedPhotos.length +
        files.length > 3
    ) {

        alert(
            "写真は最大3枚までです。"
        );

        event.target.value = "";

        return;

    }


    files.forEach(
        function(file) {

            const reader =
                new FileReader();


            reader.onload =
                function(e) {

                    selectedPhotos.push(
                        e.target.result
                    );

                    displayPhotoPreview();

                };


            reader.readAsDataURL(
                file
            );

        }
    );


    event.target.value = "";

}


/* 写真表示 */

function displayPhotoPreview() {

    const preview =
        document.getElementById(
            "photoPreview"
        );


    preview.innerHTML = "";


    selectedPhotos.forEach(
        function(photo, index) {

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "photo-box";


            box.innerHTML = `

                <img src="${photo}">

                <button
                    type="button"
                    class="photo-delete"
                    onclick="removePhoto(${index})">

                    ×

                </button>

            `;


            preview.appendChild(
                box
            );

        }
    );

}


/* 写真削除 */

function removePhoto(index) {

    selectedPhotos.splice(
        index,
        1
    );


    displayPhotoPreview();

}


/* =========================================================
   署名
========================================================= */

const canvas =
    document.getElementById(
        "signature"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


let drawing = false;

let hasSignature = false;


/* Canvasサイズ */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * ratio;


    canvas.height =
        rect.height * ratio;


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    ctx.lineWidth = 3;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

}


/* 座標取得 */

function getPosition(e) {

    const rect =
        canvas.getBoundingClientRect();


    let clientX;

    let clientY;


    if (e.touches) {

        clientX =
            e.touches[0].clientX;

        clientY =
            e.touches[0].clientY;

    } else {

        clientX =
            e.clientX;

        clientY =
            e.clientY;

    }


    return {

        x:
            clientX -
            rect.left,

        y:
            clientY -
            rect.top

    };

}


/* 描画開始 */

function startDrawing(e) {

    e.preventDefault();


    drawing = true;

    hasSignature = true;


    const pos =
        getPosition(e);


    ctx.beginPath();


    ctx.moveTo(
        pos.x,
        pos.y
    );

}


/* 描画 */

function draw(e) {

    if (!drawing) {

        return;

    }


    e.preventDefault();


    const pos =
        getPosition(e);


    ctx.lineTo(
        pos.x,
        pos.y
    );


    ctx.stroke();

}


/* 描画終了 */

function stopDrawing(e) {

    if (!drawing) {

        return;

    }


    e.preventDefault();


    drawing = false;


    ctx.closePath();

}


/* マウス */

canvas.addEventListener(
    "mousedown",
    startDrawing
);

canvas.addEventListener(
    "mousemove",
    draw
);

canvas.addEventListener(
    "mouseup",
    stopDrawing
);

canvas.addEventListener(
    "mouseleave",
    stopDrawing
);


/* タッチ */

canvas.addEventListener(
    "touchstart",
    startDrawing,
    {
        passive: false
    }
);

canvas.addEventListener(
    "touchmove",
    draw,
    {
        passive: false
    }
);

canvas.addEventListener(
    "touchend",
    stopDrawing,
    {
        passive: false
    }
);


/* 署名削除 */

function clearSignature() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    hasSignature = false;

}


/* =========================================================
   注文番号作成
========================================================= */

function createOrderNumber() {

    const today =
        new Date();


    const y =
        today.getFullYear();


    const m =
        String(
            today.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const d =
        String(
            today.getDate()
        ).padStart(
            2,
            "0"
        );


    const dateString =
        `${y}${m}${d}`;


    const orders =
        JSON.parse(
            localStorage.getItem(
                "orders"
            ) || "[]"
        );


    const todayOrders =
        orders.filter(
            function(order) {

                return (
                    order.orderNumber &&
                    order.orderNumber.startsWith(
                        dateString
                    )
                );

            }
        );


    const number =
        String(
            todayOrders.length + 1
        ).padStart(
            3,
            "0"
        );


    return (
        dateString +
        "-" +
        number
    );

}


/* =========================================================
   注文保存
========================================================= */

function saveOrder() {


    /* お客様名 */

    const name =
        document.getElementById(
            "name"
        ).value.trim();


    /* 商品 */

    const product =
        document.getElementById(
            "product"
        ).value;


    /* 受付日 */

    const delivery =
        document.getElementById(
            "delivery"
        ).value;


    /* 備考 */

    const note =
        document.getElementById(
            "note"
        ).value.trim();


    /* =========================
       入力チェック
    ========================= */

    if (!name) {

        alert(
            "お客様名または会社名を入力してください。"
        );

        return;

    }


    if (!product) {

        alert(
            "商品を選択してください。"
        );

        return;

    }


    /* =========================
       注意事項チェック
    ========================= */

    if (
        !allNoticesChecked()
    ) {

        const warning =
            document.getElementById(
                "noticeWarning"
            );


        warning.classList.add(
            "show"
        );


        alert(
            "注意事項をすべて確認し、チェックしてください。"
        );


        document
            .getElementById(
                "noticeArea"
            )
            .scrollIntoView({

                behavior: "smooth",

                block: "center"

            });


        return;

    }


    /* =========================
       署名チェック
    ========================= */

    if (!hasSignature) {

        alert(
            "お客様の署名をお願いします。"
        );

        return;

    }


    /* =========================
       注文データ
    ========================= */

    const order = {

        id:
            Date.now(),


        orderNumber:
            createOrderNumber(),


        receptionDate:
            new Date()
                .toLocaleDateString(
                    "ja-JP"
                ),


        name:
            name,


        product:
            product,


        delivery:
            delivery,


        photos:
            selectedPhotos,


        note:
            note,


        signature:
            canvas.toDataURL(
                "image/png"
            ),


        noticesAgreed:
            noticeChecked.length > 0
                ? true
                : false

    };


    /* =========================
       保存
    ========================= */

    const orders =
        JSON.parse(
            localStorage.getItem(
                "orders"
            ) || "[]"
        );


    orders.push(
        order
    );


    try {

        localStorage.setItem(
            "orders",
            JSON.stringify(
                orders
            )
        );

    }

    catch (error) {

        alert(
            "保存できませんでした。\n\n" +
            "写真の容量が大きすぎる可能性があります。"
        );

        return;

    }


    alert(

        "注文を保存しました。\n\n" +

        "注文番号：" +

        order.orderNumber

    );


    clearForm();

    displayOrders();

}


/* =========================================================
   フォームリセット
========================================================= */

function clearForm() {


    document.getElementById(
        "name"
    ).value = "";


    document.getElementById(
        "product"
    ).value = "";


    document.getElementById(
        "delivery"
    ).value = "";


    document.getElementById(
        "note"
    ).value = "";


    /* 写真 */

    selectedPhotos = [];


    document.getElementById(
        "photoPreview"
    ).innerHTML = "";


    document.getElementById(
        "cameraInput"
    ).value = "";


    document.getElementById(
        "photoInput"
    ).value = "";


    /* 注意事項 */

    noticeChecked = [];


    document.getElementById(
        "noticeList"
    ).innerHTML = "";


    document.getElementById(
        "noticeArea"
    ).style.display =
        "none";


    document.getElementById(
        "noticeWarning"
    ).classList.remove(
        "show"
    );


    /* 署名 */

    clearSignature();

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   保存済み注文表示
========================================================= */

function displayOrders() {

    const container =
        document.getElementById(
            "orders"
        );


    const orders =
        JSON.parse(
            localStorage.getItem(
                "orders"
            ) || "[]"
        );


    if (
        orders.length === 0
    ) {

        container.innerHTML =
            "<p>まだ注文はありません。</p>";

        return;

    }


    container.innerHTML = "";


    /*
       新しい注文を上に表示
    */

    [
        ...orders
    ]
    .reverse()
    .forEach(
        function(order) {


            /* 写真 */

            let photosHTML =
                "";


            if (
                order.photos &&
                order.photos.length > 0
            ) {

                photosHTML =
                    `<div class="saved-photos">`;


                order.photos.forEach(
                    function(photo) {

                        photosHTML +=
                            `<img src="${photo}">`;

                    }
                );


                photosHTML +=
                    `</div>`;

            }


            /* 署名 */

            let signatureHTML =
                "";


            if (
                order.signature
            ) {

                signatureHTML = `

                    <div>

                        <strong>
                            署名
                        </strong>

                        <br>

                        <img
                            class="saved-signature"
                            src="${order.signature}">

                    </div>

                `;

            }


            /* 注意事項 */

            let noticeHTML =
                "";


            if (
                order.noticesAgreed
            ) {

                noticeHTML = `

                    <p>

                        <strong>
                            注意事項：
                        </strong>

                        すべて了承済み ✓

                    </p>

                `;

            }


            /* 注文カード */

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "order-card";


            div.innerHTML = `

                <h3>

                    注文番号：

                    ${escapeHTML(
                        order.orderNumber
                    )}

                </h3>


                <div class="order-info">

                    <strong>
                        受付日：
                    </strong>

                    ${escapeHTML(
                        order.receptionDate
                    )}

                    <br>


                    <strong>
                        お客様名または会社名：
                    </strong>

                    ${escapeHTML(
                        order.name
                    )}

                    <br>


                    <strong>
                        商品：
                    </strong>

                    ${escapeHTML(
                        order.product
                    )}

                    <br>


                    <strong>
                        日付：
                    </strong>

                    ${escapeHTML(
                        order.delivery ||
                        "未設定"
                    )}

                    <br><br>


                    <strong>
                        備考：
                    </strong>

                    <br>

                    ${escapeHTML(
                        order.note ||
                        "なし"
                    )}


                    ${noticeHTML}

                </div>


                ${photosHTML}


                <br>


                ${signatureHTML}


                <button
                    type="button"
                    class="delete-button"
                    onclick="deleteOrder(
                        ${order.id}
                    )">

                    この注文を削除

                </button>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   注文削除
========================================================= */

function deleteOrder(id) {

    if (
        !confirm(
            "この注文を削除しますか？"
        )
    ) {

        return;

    }


    let orders =
        JSON.parse(
            localStorage.getItem(
                "orders"
            ) || "[]"
        );


    orders =
        orders.filter(
            function(order) {

                return order.id !== id;

            }
        );


    localStorage.setItem(
        "orders",
        JSON.stringify(
            orders
        )
    );


    displayOrders();

}


/* =========================================================
   起動時
========================================================= */

window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();


displayOrders();


</script>
